<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244239">
<meta name="description" content="냉장고 재료부터 식단과 장보기까지, Fresh Note">
<title>Fresh Note</title>

<style>
:root {
  --green: #73bd3a;
  --green-dark: #527e35;
  --soft: #edf5e6;
  --navy: #203b54;
  --deep: #244239;
  --muted: #78877c;
  --line: #e3eae0;
  --bg: #f7f9f5;
  --red: #af554e;
  --blue: #527da5;
  --orange: #ad784b;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--deep);
  font: 14px/1.65 "Pretendard", "Malgun Gothic", sans-serif;
  word-break: keep-all;
}
body.modal-open { overflow: hidden; }
button, input, select { font: inherit; }
button, a {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { cursor: pointer; color: inherit; border: 0; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.4; }
svg { display: block; }
[hidden] { display: none !important; }

:where(button, a, input, select):focus-visible {
  outline: 3px solid #a1c985;
  outline-offset: 3px;
}

input, select { max-width: 100%; }
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--green);
}
input:not([type="checkbox"]), select {
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  color: var(--deep);
}
input::placeholder { color: #98a294; }

.button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 10px 17px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--green);
  color: white;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
}
.button:hover:not(:disabled) { background: var(--green-dark); }
.button.navy { background: var(--navy); }
.button.secondary { background: var(--soft); color: var(--green-dark); }
.button.outline { border-color: var(--line); background: white; color: var(--deep); }
.button.danger { background: #fff0ec; color: var(--red); }
.button.small { min-height: 34px; padding: 7px 11px; font-size: 11px; }
.button.full { width: 100%; }

.icon-button {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 37px;
  height: 37px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  font-size: 21px;
}
.text-button {
  padding: 5px 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
}
.text-button:hover { color: var(--green-dark); }
.actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.muted { color: var(--muted); }
.small-text { font-size: 11px; }
.eyebrow {
  margin-bottom: 9px;
  color: var(--green-dark);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
}
.brand .note { color: var(--navy); }
.brand svg { width: 29px; height: 43px; }
.brand small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 1.5px;
}

/* 홈페이지 */
.container {
  width: min(1140px, 100%);
  margin: auto;
  padding: 0 25px;
}
.site-header {
  border-bottom: 1px solid var(--line);
  background: white;
}
.site-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 84px;
}
.site-nav { display: flex; gap: 25px; font-size: 13px; }
.site-nav a:hover { color: var(--green-dark); }
.site-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 50px;
  padding-top: 75px;
  padding-bottom: 75px;
}
.site-hero h1 {
  margin-bottom: 23px;
  color: var(--navy);
  font-size: clamp(38px, 4.5vw, 56px);
  letter-spacing: -2px;
}
.description { color: var(--muted); line-height: 1.9; }
.site-hero .button { margin-top: 27px; }
.site-visual {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 390px;
}
.site-circle {
  width: 330px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #dcefc9;
}
.fridge-preview {
  position: absolute;
  width: 285px;
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: white;
  box-shadow: 0 20px 50px #24423910;
  transform: rotate(-4deg);
}
.fridge-preview h2 { margin: 6px 0 15px; font-size: 20px; }
.preview-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.preview-row > span:first-child { font-size: 25px; }
.preview-row small { margin-left: auto; color: var(--orange); }
.site-section { padding: 65px 0; }
.site-section.soft { background: #edf3e7; }
.center { text-align: center; }
.site-title {
  margin-bottom: 15px;
  color: var(--navy);
  font-size: 31px;
  letter-spacing: -1px;
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-top: 28px;
}
.feature-card {
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
}
.feature-card > span {
  display: flex;
  align-items: center;
  width: 36px;
  height: 36px;
  margin-bottom: 17px;
  color: var(--green-dark);
}
.feature-card > span svg {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}
.feature-card h3 { margin-bottom: 11px; font-size: 16px; }
.feature-card p { color: var(--muted); font-size: 12px; }
.feature-card a {
  display: inline-block;
  margin-top: 18px;
  font-size: 12px;
  font-weight: 700;
}
.site-banner {
  margin: 30px 0 65px;
  padding: 45px 24px;
  border-radius: 20px;
  background: #deedcf;
  text-align: center;
}
.site-banner h2 { font-size: 28px; }
.site-banner p { margin: 13px 0 23px; color: var(--muted); }
.site-footer {
  padding: 30px 0;
  border-top: 1px solid var(--line);
  background: white;
}

/* 관리 앱 */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  width: 225px;
  padding: 32px 20px;
  border-right: 1px solid var(--line);
  background: white;
}
.nav-label {
  margin: 42px 13px 15px;
  color: #98a493;
  font-size: 10px;
  letter-spacing: 2px;
}
.app-nav { display: grid; gap: 7px; }
.app-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 47px;
  padding: 11px 15px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
}
.app-nav a.active {
  background: var(--soft);
  color: var(--green-dark);
  font-weight: 700;
}
.nav-icon { font-size: 20px; }
.sidebar-bottom {
  margin-top: auto;
  padding: 25px 12px 0;
  font-size: 12px;
}
.sidebar-bottom p { margin: 8px 0 20px; color: var(--muted); }
.sidebar-bottom .actions { align-items: stretch; flex-direction: column; }
.workspace { margin-left: 225px; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 77px;
  padding: 0 35px;
  border-bottom: 1px solid var(--line);
  background: white;
}
.breadcrumb { font-size: 12px; }
.breadcrumb span { color: var(--muted); }
.mobile-brand { display: none; }
.top-actions {
  display: flex;
  align-items: center;
  gap: 13px;
  color: var(--muted);
  font-size: 11px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--soft);
}
.app-main {
  width: min(1280px, 100%);
  min-height: calc(100dvh - 150px);
  margin: auto;
  padding: 34px 35px;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 26px;
}
.page-heading h1 { font-size: 28px; letter-spacing: -1px; }
.subtitle { margin-top: 8px; color: var(--muted); font-size: 12px; }
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}
.section-heading h2 { font-size: 18px; }
.panel {
  padding: 23px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
}
.section-gap { margin-top: 28px; }
.empty {
  padding: 35px 18px;
  border: 1px dashed #cedbc5;
  border-radius: 12px;
  color: var(--muted);
  text-align: center;
  font-size: 12px;
}
.empty .button { margin-top: 15px; }
.count { margin-bottom: 13px; color: var(--muted); font-size: 11px; }
.notice {
  margin-bottom: 20px;
  padding: 13px 16px;
  border: 1px solid #e8d8bc;
  border-radius: 10px;
  background: #fff9ec;
  color: #876a3e;
  font-size: 12px;
}
.notice .actions { margin-top: 10px; }
.app-footer { padding: 18px 35px; color: #93a08e; font-size: 10px; }

/* 홈 */
.home-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
  padding: 28px 31px;
  border-radius: 17px;
  background: #e8f1df;
}
.home-hero h2 { margin-bottom: 11px; font-size: 25px; letter-spacing: -.7px; }
.home-hero p:not(.eyebrow) { color: #74856a; font-size: 12px; }
.home-hero a { display: inline-block; margin-top: 17px; font-size: 12px; font-weight: 700; }
.home-fridge {
  width: 100px;
  height: 150px;
  margin-right: 25px;
  transform: rotate(6deg);
  flex-shrink: 0;
}
.home-fridge svg { width: 100%; height: 100%; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 27px;
}
.stat {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
}
.stat span { color: var(--muted); font-size: 11px; }
.stat strong { display: block; margin-top: 8px; color: var(--stat-color); font-size: 29px; }
.stat strong small { margin-left: 4px; color: var(--muted); font-size: 10px; font-weight: 400; }
.home-columns {
  display: grid;
  grid-template-columns: 1fr 310px;
  align-items: start;
  gap: 23px;
}

/* 식재료 */
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
.toolbar input { flex: 1; min-width: 170px; }
.toolbar select { font-size: 12px; }
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 19px;
}
.chip {
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: white;
  color: var(--muted);
  font-size: 11px;
}
.chip.active { border-color: var(--deep); background: var(--deep); color: white; }
.ingredient-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.home-columns .ingredient-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ingredient-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
}
.ingredient-edit {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 0;
  background: transparent;
  text-align: left;
}
.ingredient-emoji {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 47px;
  height: 55px;
  border-radius: 10px;
  background: #f0f5e9;
  font-size: 29px;
}
.ingredient-info { min-width: 0; }
.ingredient-info strong { display: block; overflow-wrap: anywhere; font-size: 14px; }
.ingredient-info small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
.dday {
  display: inline-block;
  margin-top: 9px;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--soft);
  color: var(--green-dark);
  font-size: 10px;
}
.dday.urgent { background: #fff1e5; color: var(--orange); }
.dday.expired { background: #f7eae7; color: var(--red); }
.card-bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 10px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

/* 레시피 검색 */
.discovery-banner {
  margin-bottom: 20px;
  padding: 23px;
  border: 1px solid #dce8cf;
  border-radius: 15px;
  background: var(--soft);
}
.discovery-banner h2 { font-size: 21px; }
.discovery-banner p { margin-top: 8px; color: #708267; font-size: 12px; }
.source-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
.source-tag {
  padding: 4px 10px;
  border: 1px solid #d8e3cf;
  border-radius: 20px;
  background: #ffffffb8;
  color: var(--green-dark);
  font-size: 11px;
}
.discovery-form { display: flex; gap: 8px; margin-top: 16px; }
.discovery-form input { flex: 1; width: 100%; font-size: 12px; }
.discovery-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}
.discovery-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
}
.discovery-icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin-bottom: 17px;
  border-radius: 12px;
  background: var(--soft);
  color: var(--green-dark);
  font-size: 22px;
}
.discovery-card h3 { margin-bottom: 9px; font-size: 17px; }
.discovery-card p { margin-bottom: 19px; color: var(--muted); font-size: 12px; }
.discovery-card .actions { align-items: stretch; flex-direction: column; margin-top: auto; }
.source-youtube { background: #fff0ed; color: #b8574b; }
.source-recipe { background: var(--soft); color: var(--green-dark); }

/* 식단 */
.calendar-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 22px;
  align-items: start;
}
.calendar-panel {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
}
.calendar-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
.month-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.month-heading h2 { font-size: 20px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.weekday { padding: 10px 0; color: var(--muted); text-align: center; font-size: 11px; }
.sunday { color: var(--red); }
.saturday { color: var(--blue); }
.day {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 58px;
  padding: 9px 3px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  font-size: 12px;
}
.day:hover { background: var(--soft); }
.day.today { border-color: #b1cda0; }
.day.selected { border-color: #b0cc9a; background: #eaf3e0; font-weight: 700; }
.day.has-meal::after {
  content: "";
  position: absolute;
  bottom: 6px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--green);
}
.selected-date-title { font-size: 22px; letter-spacing: -.6px; }
.meal-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 17px 0;
  border-bottom: 1px solid #edf1e8;
}
.meal-label {
  flex-shrink: 0;
  padding: 4px 7px;
  border-radius: 6px;
  background: var(--soft);
  color: var(--green-dark);
  font-size: 10px;
}
.meal-row strong { display: block; overflow-wrap: anywhere; font-size: 12px; }
.meal-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
.meal-actions { display: grid; gap: 9px; margin-top: 19px; }
.view-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.view-tabs button {
  padding: 8px 15px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  color: var(--muted);
  font-size: 12px;
}
.view-tabs button.active { background: var(--deep); color: white; border-color: var(--deep); }

.week-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.week-table th, .week-table td {
  padding: 12px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}
.week-table thead th { color: var(--muted); font-size: 11px; font-weight: 500; }
.week-table th:first-child { width: 90px; }
.week-table th:last-child { width: 52px; }
.week-table tr.selected-row { background: #f4f8ef; }
.week-date { padding: 5px 3px; background: transparent; text-align: left; font-size: 12px; }
.week-date small { display: block; font-size: 10px; font-weight: 400; }
.week-menu {
  width: 100%;
  padding: 5px 0;
  background: transparent;
  text-align: left;
  overflow-wrap: anywhere;
  font-size: 11px;
}
.week-menu small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
.week-menu.empty-menu { color: #a0aa9a; }
.range-panel {
  margin-top: 23px;
  padding: 21px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #f0f5e9;
}
.range-panel h2 { font-size: 17px; }
.range-panel > p { margin-top: 7px; color: var(--muted); font-size: 11px; }
.range-form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px;
  margin-top: 15px;
}
.range-form label { display: grid; flex: 1; gap: 5px; min-width: 140px; font-size: 11px; }

/* 장보기 */
.shopping-panel { max-width: 880px; margin: auto; }
.shopping-form { display: flex; gap: 8px; margin-bottom: 22px; }
.shopping-form input[name="name"] { flex: 1; width: 100%; }
.shopping-form input[name="quantity"] { width: 110px; }
.shopping-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.shopping-summary h2 { font-size: 17px; }
.shopping-summary span { color: var(--muted); font-size: 11px; }
.progress { height: 5px; margin: 15px 0; overflow: hidden; border-radius: 10px; background: #edf2e6; }
.progress span { display: block; height: 100%; background: var(--green); }
.shopping-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 110px auto 28px;
  align-items: center;
  gap: 9px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.shopping-label {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  cursor: pointer;
}
.shopping-label span { overflow-wrap: anywhere; }
.shopping-label input { flex-shrink: 0; margin: 0; }
.shopping-row.done .shopping-label span { color: #9ba696; text-decoration: line-through; }
.shopping-row > small { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.shopping-row .row-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.registered-label { color: var(--green-dark); font-size: 10px; }
.remove { flex-shrink: 0; padding: 5px; background: transparent; color: var(--muted); font-size: 19px; }
.shopping-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}

/* 모달 */
dialog {
  width: min(640px, calc(100% - 28px));
  max-height: 87dvh;
  padding: 25px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: white;
  color: var(--deep);
}
dialog::backdrop { background: #18302570; backdrop-filter: blur(3px); }
.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 22px;
}

<script>
"use strict";

/* 공통 도구 */
const $ = (selector, root = document) => root.querySelector(selector);
const STORAGE_KEY = "freshnote-v1";
const MEALS = ["아침", "점심", "저녁"];
const CATEGORIES = ["채소", "과일", "육류", "유제품", "냉동", "기타"];
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function uid() {
  return globalThis.crypto?.randomUUID?.()
    || Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function dateKey(date = new Date()) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}

function dayNumber(key) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key));
  if (!match) return NaN;

  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  const date = new Date(Date.UTC(year, month - 1, day));

  if (
    year < 2000 || year > 2100 ||
    date.getUTCFullYear() !== year ||
    date.getUTCMonth() !== month - 1 ||
    date.getUTCDate() !== day
  ) return NaN;

  return date.getTime() / 86400000;
}

function localDate(key) {
  return new Date(key + "T12:00:00");
}

function addDays(key, offset) {
  const date = localDate(key);
  date.setDate(date.getDate() + offset);
  return dateKey(date);
}

function remainingDays(key) {
  return dayNumber(key) - dayNumber(dateKey());
}

function futureDate(offset) {
  return addDays(dateKey(), offset);
}

function weekStart(key) {
  const weekday = localDate(key).getDay();
  return addDays(key, -(weekday === 0 ? 6 : weekday - 1));
}

function rangeDates(start, end) {
  const first = dayNumber(start);
  const last = dayNumber(end);

  if (!Number.isFinite(first) || !Number.isFinite(last) || last < first) {
    throw new Error("시작일과 종료일을 확인해 주세요.");
  }

  if (last - first > 61) {
    throw new Error("한 번에 최대 62일의 식단을 합산할 수 있어요.");
  }

  return Array.from(
    { length: last - first + 1 },
    (_, index) => addDays(start, index)
  );
}

function shortDate(key) {
  return `${Number(key.slice(5, 7))}/${Number(key.slice(8, 10))}`;
}

function normalize(name) {
  const value = String(name).normalize("NFKC")
    .replace(/\s+/g, "").toLowerCase();

  const aliases = {
    달걀: "계란",
    스파게티면: "파스타",
    파스타면: "파스타",
    건미역: "미역",
    마른미역: "미역",
    쌀밥: "밥",
    찬밥: "밥",
    다진마늘: "마늘"
  };

  return aliases[value] || value;
}

function emojiFor(category) {
  return {
    채소: "🥬",
    과일: "🍎",
    육류: "🥩",
    유제품: "🥛",
    냉동: "🧊",
    기타: "🧺"
  }[category] || "🧺";
}

function fridgeSVG() {
  return `<svg viewBox="0 0 150 220" aria-hidden="true">
    <rect x="23" y="205" width="22" height="13" rx="7" fill="#bfc8bc"/>
    <rect x="105" y="205" width="22" height="13" rx="7" fill="#bfc8bc"/>
    <rect x="12" y="4" width="126" height="207" rx="23"
      fill="#fdfef9" stroke="#bfc8bc" stroke-width="3"/>
    <path d="M13 80h124" stroke="#c3cbc0" stroke-width="2"/>
    <path d="M24 50v19m0 27v34" stroke="#c3cbc0"
      stroke-width="6" stroke-linecap="round"/>
    <rect x="37" y="21" width="32" height="33" rx="2"
      fill="#7ec842" transform="rotate(-8 53 37)"/>
    <text x="73" y="101" fill="#72b93c" font-family="sans-serif"
      font-size="10" font-weight="bold">Fresh<tspan fill="#203b54">Note</tspan></text>
  </svg>`;
}

function brandMarkup() {
  return `${fridgeSVG()}<span>Fresh<span class="note">Note</span></span>`;
}

/* 홈페이지의 네 가지 SVG 아이콘 */
function featureIcon(type) {
  const paths = {
    fridge: `
      <rect x="5" y="2.5" width="14" height="19" rx="2.5"/>
      <path d="M5 10h14"/>
      <path d="M8.5 6v1.5"/>
      <path d="M8.5 13.5V17"/>
      <path d="M8 21.5v1"/>
      <path d="M16 21.5v1"/>
    `,
    chef: `
      <path d="
        M7 15
        a4.5 4.5 0 0 1-1.4-8.8
        a6.5 6.5 0 0 1 12.8 0
        A4.5 4.5 0 0 1 17 15
      "/>
      <path d="M7 14v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-6"/>
      <path d="M7 17.5h10"/>
      <path d="M10 11.5v2"/>
      <path d="M14 11.5v2"/>
    `,
    calendar: `
      <rect x="3" y="4.5" width="18" height="17" rx="2.5"/>
      <path d="M7.5 2.5v4"/>
      <path d="M16.5 2.5v4"/>
      <path d="M3 9.5h18"/>
      <path d="m8 15 2.5 2.5L16 12"/>
    `,
    cart: `
      <path d="M2.5 3.5h2.3l2.8 12.2a1.5 1.5 0 0 0 1.5 1.2h9.2"/>
      <path d="M5.6 7h15.9l-1.8 6.5a1.5 1.5 0 0 1-1.4 1.1H7.4"/>
      <circle cx="9.5" cy="20" r="1.3"/>
      <circle cx="18" cy="20" r="1.3"/>
    `
  };

  return `<svg
    xmlns="http://www.w3.org/2000/svg"
    width="32"
    height="32"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >${paths[type] || ""}</svg>`;
}

/* 수량 계산 */
const Q = (() => {
  const table = {
    g: ["g", 1],
    그램: ["g", 1],
    kg: ["g", 1000],
    킬로그램: ["g", 1000],
    ml: ["ml", 1],
    밀리리터: ["ml", 1],
    l: ["ml", 1000],
    리터: ["ml", 1000]
  };

  for (const unit of [
    "개", "모", "대", "장", "팩", "봉", "통", "병",
    "캔", "쪽", "공기", "큰술", "작은술"
  ]) {
    table[unit] = [unit, 1];
  }

  const round = value => Math.round(value * 1e6) / 1e6;

  function parse(raw) {
    const value = String(raw ?? "")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/^반(?=[a-z가-힣])/, "0.5");

    const match = /^(\d+(?:\.\d+)?|\.\d+)(?:\/(\d+(?:\.\d+)?))?([a-z가-힣]+)$/.exec(value);
    if (!match || !table[match[3]]) return null;

    const divisor = match[2] === undefined ? 1 : Number(match[2]);
    if (divisor <= 0) return null;

    const [unit, factor] = table[match[3]];
    const amount = Number(match[1]) / divisor * factor;

    if (!Number.isFinite(amount) || amount < 0 || amount > 1e12) return null;
    return { amount: round(amount), unit };
  }

  function format(amount, unit) {
    amount = round(amount);

    if (unit === "g" && amount >= 1000) {
      return `${round(amount / 1000)}kg`;
    }

    if (unit === "ml" && amount >= 1000) {
      return `${round(amount / 1000)}L`;
    }

    return `${amount}${unit}`;
  }

  function shortage(required, stock, cart) {
    const parsedRequired = required.map(parse);

    if (
      !parsedRequired.length ||
      parsedRequired.some(item =>
        !item || item.amount <= 0 ||
        item.unit !== parsedRequired[0].unit
      )
    ) return null;

    const unit = parsedRequired[0].unit;
    const total = round(
      parsedRequired.reduce((sum, item) => sum + item.amount, 0)
    );

    const owned = stock.map(parse);
    const known = round(
      owned.filter(item => item && item.unit === unit)
        .reduce((sum, item) => sum + item.amount, 0)
    );

    if (known >= total) {
      return { unit, total, stock: known, cart: 0, extra: 0 };
    }

    if (owned.some(item => !item || item.unit !== unit)) return null;

    const pending = cart.map(parse);
    if (pending.some(item => !item || item.unit !== unit)) return null;

    const planned = round(
      pending.reduce((sum, item) => sum + item.amount, 0)
    );

    return {
      unit,
      total,
      stock: known,
      cart: planned,
      extra: round(Math.max(0, total - known - planned))
    };
  }

  function consume(stock, use) {
    const owned = parse(stock);
    const used = parse(use);

    if (
      !owned || !used || used.amount <= 0 ||
      owned.unit !== used.unit || used.amount > owned.amount
    ) {
      throw new Error("사용량과 단위를 확인해 주세요. 보유량보다 많이 차감할 수 없어요.");
    }

    const left = round(owned.amount - used.amount);
    return left ? format(left, owned.unit) : null;
  }

  function merge(oldQuantity, newQuantity) {
    const oldValue = parse(oldQuantity);
    const newValue = parse(newQuantity);

    if (
      !oldValue || !newValue ||
      oldValue.unit !== newValue.unit ||
      oldValue.amount <= 0 || newValue.amount <= 0
    ) {
      throw new Error("합칠 수 있는 수량과 단위인지 확인해 주세요.");
    }

    const result = format(
      oldValue.amount + newValue.amount,
      oldValue.unit
    );

    if (!parse(result)) throw new Error("합산할 수량이 너무 큽니다.");
    return result;
  }

  return { parse, format, round, shortage, consume, merge };
})();

function positiveQuantity(value) {
  const text = String(value).normalize("NFKC").trim();

  if (!text || /^-/.test(text)) return false;

  if (
    /^0(?:\.0+)?\s*(?:개|팩|봉|통|병|캔|모|대|장|쪽|공기|큰술|작은술|g|kg|ml|l)?$/i.test(text)
  ) return false;

  const parsed = Q.parse(text);
  return !parsed || parsed.amount > 0;
}

/* 저장 데이터 검증 */
function emptyState() {
  return {
    ingredients: [],
    shopping: [],
    meals: {},
    mealIngredients: {}
  };
}

function isRecord(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

function cleanText(value, max, allowEmpty = false) {
  if (typeof value !== "string") {
    throw new Error("문자열 형식을 확인해 주세요.");
  }

  const result = value.trim();

  if ((!allowEmpty && !result) || result.length > max) {
    throw new Error("입력 내용의 길이를 확인해 주세요.");
  }

  return result;
}

function validateState(raw) {
  if (
    !isRecord(raw) ||
    !Array.isArray(raw.ingredients) ||
    !Array.isArray(raw.shopping) ||
    !isRecord(raw.meals) ||
    raw.ingredients.length > 1000 ||
    raw.shopping.length > 1000
  ) {
    throw new Error("저장 데이터 구조가 올바르지 않습니다.");
  }

  const result = emptyState();

  function validateRows(list, type) {
    const ids = new Set();

    return list.map(item => {
      if (!isRecord(item)) {
        throw new Error("항목 형식이 올바르지 않습니다.");
      }

      const id = cleanText(item.id, 100);

      if (ids.has(id)) throw new Error("중복된 항목 ID가 있습니다.");
      ids.add(id);

      const row = {
        id,
        name: cleanText(item.name, 40),
        quantity: cleanText(item.quantity, 30)
      };

      if (type === "ingredients") {
        if (
          !CATEGORIES.includes(item.category) ||
          !Number.isFinite(dayNumber(item.expiry))
        ) {
          throw new Error("식재료 분류 또는 날짜를 확인해 주세요.");
        }

        Object.assign(row, {
          category: item.category,
          expiry: item.expiry,
          emoji: typeof item.emoji === "string" && item.emoji.length <= 20
            ? item.emoji : emojiFor(item.category)
        });
      } else {
        if (typeof item.done !== "boolean") {
          throw new Error("구매 상태를 확인해 주세요.");
        }

        row.done = item.done;

        if (item.registeredAt !== undefined) {
          if (
            !item.done ||
            typeof item.registeredAt !== "string" ||
            !Number.isFinite(Date.parse(item.registeredAt))
          ) {
            throw new Error("냉장고 등록 기록을 확인해 주세요.");
          }

          row.registeredAt = item.registeredAt;
        }
      }

      return row;
    });
  }

  result.ingredients = validateRows(raw.ingredients, "ingredients");
  result.shopping = validateRows(raw.shopping, "shopping");

  if (Object.keys(raw.meals).length > 4000) {
    throw new Error("식단 데이터가 너무 많습니다.");
  }

  for (const [date, meals] of Object.entries(raw.meals)) {
    if (!Number.isFinite(dayNumber(date)) || !isRecord(meals)) {
      throw new Error("식단 날짜를 확인해 주세요.");
    }

    result.meals[date] = Object.fromEntries(
      MEALS.map(meal => [
        meal,
        cleanText(meals[meal] ?? "", 100, true)
      ])
    );
  }

  if (
    raw.mealIngredients !== undefined &&
    !isRecord(raw.mealIngredients)
  ) {
    throw new Error("식단 재료 형식이 올바르지 않습니다.");
  }

  const materials = raw.mealIngredients || {};

  if (Object.keys(materials).length > 1000) {
    throw new Error("식단 재료가 너무 많습니다.");
  }

  for (const [date, groups] of Object.entries(materials)) {
    if (!Number.isFinite(dayNumber(date)) || !isRecord(groups)) {
      throw new Error("식단 재료 날짜를 확인해 주세요.");
    }

    const output = {};

    for (const meal of MEALS) {
      const list = groups[meal] || [];

      if (!Array.isArray(list) || list.length > 10) {
        throw new Error("한 끼당 재료는 10개까지 등록할 수 있어요.");
      }

      const seen = new Set();

      const clean = list.map(item => {
        if (!isRecord(item)) throw new Error("재료 형식을 확인해 주세요.");

        const name = cleanText(item.name, 40);
        const quantity = cleanText(item.quantity, 30);
        const key = normalize(name);

        if (seen.has(key)) {
          throw new Error("같은 끼니에 중복된 재료가 있습니다.");
        }

        if (!positiveQuantity(quantity)) {
          throw new Error("재료 수량을 확인해 주세요.");
        }

        seen.add(key);
        return { name, quantity };
      });

      if (clean.length && !result.meals[date]?.[meal]) {
        throw new Error("메뉴 없이 등록된 식단 재료가 있습니다.");
      }

      if (clean.length) output[meal] = clean;
    }

    if (Object.keys(output).length) {
      result.mealIngredients[date] = output;
    }
  }

  return result;
}

/* 저장 및 모달 */
let state = emptyState();
let blocked = false;
let memoryOnly = false;
let rawOriginal = null;

try {
  rawOriginal = localStorage.getItem(STORAGE_KEY);

  if (rawOriginal !== null) {
    state = validateState(JSON.parse(rawOriginal));
  }
} catch {
  if (rawOriginal !== null) blocked = true;
  else memoryOnly = true;
}

let undoRecord = null;
let toastTimer;
let pendingImport = null;
let currentQuote = null;
let modalSnapshot = "";
let importSequence = 0;

function showToast(message, undo = false) {
  $("#toast").innerHTML = `<span>${esc(message)}</span>${
    undo ? '<button type="button" data-action="undo">되돌리기</button>' : ""
  }`;

  $("#toast").classList.add("visible");
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    $("#toast").classList.remove("visible");
  }, undo ? 8000 : 3800);
}

function commit(next, message, undo = true, recover = false) {
  if (blocked && !recover) {
    showToast("기존 저장 데이터를 먼저 복구하거나 백업해 주세요.");
    return false;
  }

  let valid;

  try {
    valid = validateState(next);
  } catch (error) {
    showToast(error.message);
    return false;
  }

  const before = clone(state);
  state = valid;

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    memoryOnly = false;
  } catch {
    memoryOnly = true;
  }

  if (recover) blocked = false;

  undoRecord = undo
    ? { before, after: JSON.stringify(state) }
    : null;

  render();

  showToast(
    memoryOnly
      ? `${message} 영구 저장이 제한되어 백업이 필요해요.`
      : message,
    Boolean(undoRecord)
  );

  return true;
}

function requireFreshModal() {

  }
}

$("#modal").addEventListener("close", () => {
  document.body.classList.remove("modal-open");
  pendingImport = null;
  currentQuote = null;
  modalSnapshot = "";
});

$("#modal").addEventListener("click", event => {
  if (event.target !== $("#modal")) return;

  const rect = $("#modal").getBoundingClientRect();

  if (
    event.clientX < rect.left || event.clientX > rect.right ||
    event.clientY < rect.top || event.clientY > rect.bottom
  ) closeModal();
});

/* 식재료 */

  return `<article class="ingredient-card">
    <button class="ingredient-edit" data-edit="${esc(item.id)}"

        <small>${esc(item.quantity)} · ${esc(item.category)}</small>
      </span>
    </button>

    <span class="dday ${days < 0 ? "expired" : days <= 3 ? "urgent" : ""}">
      ${label} · ${esc(item.expiry.slice(5).replace("-", "."))}

    <div class="card-bottom">
      <button class="text-button" data-consume="${esc(item.id)}">사용량 기록</button>

function updateIngredientResults() {
  const query = normalize(view.query);

  const list = state.ingredients.filter(item => {
    const days = remainingDays(item.expiry);

    const status = {
      all: true,
      urgent: days >= 0 && days <= 3,
      soon: days > 3 && days <= 7,
      fresh: days > 7,
      expired: days < 0
    }[view.status];

    return status &&
      (view.category === "전체" || item.category === view.category) &&
      normalize(item.name).includes(query);
  });

  list.sort(view.sort === "name"
    ? (a, b) => a.name.localeCompare(b.name, "ko")
    : (a, b) => a.expiry.localeCompare(b.expiry));

  $("#ingredient-results").innerHTML = `
    <p class="count">총 <strong>${list.length}</strong>개의 식재료</p>

    ${list.length
      ? `<div class="ingredient-grid">${list.map(ingredientCard).join("")}</div>`
      : '<div class="empty">조건에 맞는 식재료가 없어요.<br>검색 조건을 바꾸거나 식재료를 추가해 주세요.</div>'}`;
}

/* 수량 입력 */
const UNIT_OPTIONS = [
  "g", "kg", "ml", "L", "개", "모", "대", "장", "팩",
  "봉", "통", "병", "캔", "쪽", "공기", "큰술", "작은술"
];

function quantityEditor(value = "1개", fallbackUnit = "개", standardOnly = false) {
  const parsed = Q.parse(value);
  const mode = parsed || !value || standardOnly ? "standard" : "custom";

  return `<div data-quantity-editor data-mode="${mode}">
    ${standardOnly ? "" : `
      <div class="quantity-mode">
        <button type="button" data-quantity-mode="standard"
          class="${mode === "standard" ? "active" : ""}">숫자 + 단위</button>
        <button type="button" data-quantity-mode="custom"
          class="${mode === "custom" ? "active" : ""}">직접 입력</button>
      </div>
    `}

    <div class="quantity-standard" ${mode === "custom" ? "hidden" : ""}>
      <input data-quantity-number inputmode="decimal" maxlength="20"
        value="${parsed ? parsed.amount : ""}"
        placeholder="예: 200 또는 1/2" aria-label="수량 숫자">

      <select data-quantity-unit aria-label="수량 단위">
        ${UNIT_OPTIONS.map(unit => `
          <option value="${unit}"
            ${unit === (parsed?.unit || fallbackUnit) ? "selected" : ""}>
            ${unit}
          </option>
        `).join("")}
      </select>
    </div>

    <input data-quantity-custom maxlength="30" aria-label="수량 직접 입력"
      value="${esc(value)}" placeholder="예: 1팩(200g), 분량 확인"
      ${mode === "standard" ? "hidden" : ""}>

    <input type="hidden" name="quantity" value="${esc(value)}">
    <p class="quantity-preview"></p>
  </div>`;
}

function syncQuantity(editor) {
  if (!editor) return "";

  const mode = editor.dataset.mode;
  const number = $("[data-quantity-number]", editor);
  const unit = $("[data-quantity-unit]", editor);
  const custom = $("[data-quantity-custom]", editor);

  let value;
  let valid = true;

  number.setCustomValidity("");
  custom.setCustomValidity("");

  if (mode === "standard") {
    value = number.value.trim() + unit.value;
    const parsed = Q.parse(value);

    if (!parsed || parsed.amount <= 0) {
      number.setCustomValidity(
        "0보다 큰 수량을 입력해 주세요. 0.5 또는 1/2도 사용할 수 있어요."
      );
      valid = false;
    }
  } else {
    value = custom.value.trim();

    if (!value || value.length > 30 || !positiveQuantity(value)) {
      custom.setCustomValidity("수량을 확인해 주세요.");
      valid = false;
    }
  }

  number.required = mode === "standard";
  custom.required = mode === "custom";
  number.disabled = mode !== "standard";
  unit.disabled = mode !== "standard";
  custom.disabled = mode !== "custom";

  $("[name=quantity]", editor).value = value;

  const parsed = Q.parse(value);

  $(".quantity-preview", editor).textContent = valid
    ? parsed
      ? `계산 기준: ${parsed.amount}${parsed.unit}`
      : "이 수량은 장보기 연결 시 직접 확인해 주세요."
    : "수량을 입력해 주세요.";

  return valid ? value : "";
}

/* 사용량 차감 */
function openConsumeForm(id) {
  const item = state.ingredients.find(row => row.id === id);
  if (!item) return;

  const amount = Q.parse(item.quantity);

  if (!amount || amount.amount <= 0) {

  }

  openModal("사용한 만큼 기록하기", `
    <form id="consume-form">

        현재 남은 수량 ${esc(item.quantity)}
      </div>

      <div class="field">
        <span>이번에 사용한 수량</span>
        ${quantityEditor("", amount.unit, true)}
      </div>

      <p id="consume-preview" class="help">
        사용량을 입력하면 남는 수량을 확인할 수 있어요.
      </p>

      <p class="help">
        전부 사용하면 냉장고 목록에서 제외됩니다.
        식단을 기록하는 것만으로는 재고를 자동 차감하지 않아요.

        <button class="button">사용량 반영</button>

  syncQuantity($("[data-quantity-editor]", $("#modal")));

function updateConsumePreview() {
  const form = $("#consume-form");
  if (!form) return;

  const item = state.ingredients.find(
    row => row.id === $("[name=id]", form).value
  );

  if (!item) return;

  const value = $("[name=quantity]", form).value;

  try {
    const left = Q.consume(item.quantity, value);

    $("#consume-preview").textContent = left
      ? `사용 후 남는 수량: ${left}`
      : "모두 사용했어요. 냉장고 목록에서 제외됩니다.";
  } catch {
    $("#consume-preview").textContent =
      "같은 종류의 단위로, 보유량 이하의 사용량을 입력해 주세요.";
  }
}

/* 맞춤 요리 검색 */

/* 식단 공통 */
function hasMeal(date) {
  return Object.values(state.meals[date] || {}).some(Boolean);
}

function mealRows(date) {
  const meals = state.meals[date] || {};

  return MEALS.map(meal => {
    const materials = state.mealIngredients[date]?.[meal] || [];

    return `<div class="meal-row">
      <span class="meal-label">${meal}</span>
      <div>
        <strong>${esc(meals[meal] || "아직 정한 식단이 없어요")}</strong>
        <small>${materials.length
          ? `필요 재료 ${materials.length}개 기록됨`
          : meals[meal]
            ? "필요한 재료도 함께 기록해 보세요."
            : "메뉴를 기록해 하루를 계획해 보세요."}</small>
      </div>
    </div>`;
  }).join("");
}

function mealShoppingButton(date) {
  const count = MEALS.reduce(
    (sum, meal) => sum + (state.mealIngredients[date]?.[meal]?.length || 0),
    0
  );

  return count
    ? `<button class="button outline full" data-day-shopping="${date}">
        이 날 재료 확인 · 장보기 연결
      </button>`
    : "";
}

function dailyPanel() {
  const chosen = localDate(selectedDate);
  const weekday = chosen.getDay();
  const color = weekday === 0 ? "sunday" : weekday === 6 ? "saturday" : "";

  return `<section class="panel">
    <p class="eyebrow">YOUR DAILY MENU</p>

    <h2 class="selected-date-title">
      ${chosen.getMonth() + 1}월 ${chosen.getDate()}일
      <span class="${color}">${WEEKDAYS[weekday]}요일</span>
    </h2>

    ${mealRows(selectedDate)}

    <div class="meal-actions">
      <button class="button full" data-edit-meal="${selectedDate}">
        ＋ 식단 추가 · 수정
      </button>

      ${hasMeal(selectedDate)
        ? `<button class="button secondary full" data-copy-meal="${selectedDate}">
            다른 날짜로 복사
          </button>`
        : ""}

      ${mealShoppingButton(selectedDate)}
    </div>
  </section>`;
}

function monthCalendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();

  return `<section class="calendar-panel">
    <div class="calendar-toolbar">
      <div class="month-heading">
        <button class="icon-button" data-month="-1" aria-label="이전 달">‹</button>
        <h2>${year}년 ${month + 1}월</h2>
        <button class="icon-button" data-month="1" aria-label="다음 달">›</button>
      </div>

      <button class="button outline small" data-action="calendar-today">오늘</button>
    </div>

    <div class="calendar-grid">
      ${WEEKDAYS.map((day, index) => `
        <span class="weekday ${
          index === 0 ? "sunday" : index === 6 ? "saturday" : ""
        }">${day}</span>
      `).join("")}

      ${"<span></span>".repeat(firstDay)}

      ${Array.from({ length: lastDay }, (_, index) => {
        const day = index + 1;
        const date = new Date(year, month, day);
        const key = dateKey(date);
        const weekday = date.getDay();
        const color = weekday === 0 ? "sunday" : weekday === 6 ? "saturday" : "";

        return `<button
          class="day ${color}
            ${key === selectedDate ? "selected" : ""}
            ${key === dateKey() ? "today" : ""}
            ${hasMeal(key) ? "has-meal" : ""}"
          data-date="${key}"
          aria-label="${year}년 ${month + 1}월 ${day}일 ${WEEKDAYS[weekday]}요일${hasMeal(key) ? ", 식단 기록 있음" : ""}"
          aria-pressed="${key === selectedDate}"
          ${key === dateKey() ? 'aria-current="date"' : ""}>
          ${day}
        </button>`;
      }).join("")}
    </div>

    <p class="help" style="margin:14px 5px 0">
      초록색 점은 식단이 기록된 날이에요.
    </p>
  </section>`;
}

function weekCalendar() {
  const start = weekStart(selectedDate);
  const dates = Array.from({ length: 7 }, (_, index) => addDays(start, index));

  return `<section class="calendar-panel">
    <div class="calendar-toolbar">
      <div class="month-heading">
        <button class="icon-button" data-week="-1" aria-label="이전 주">‹</button>
        <h2>${shortDate(start)} ~ ${shortDate(addDays(start, 6))}</h2>
        <button class="icon-button" data-week="1" aria-label="다음 주">›</button>
      </div>

      <button class="button outline small" data-action="calendar-today">이번 주</button>
    </div>

    <table class="week-table" aria-label="주간 식단표">
      <thead>
        <tr>
          <th scope="col">날짜</th>
          ${MEALS.map(meal => `<th scope="col">${meal}</th>`).join("")}
          <th scope="col">복사</th>
        </tr>
      </thead>

      <tbody>
        ${dates.map(date => {
          const weekday = localDate(date).getDay();
          const color = weekday === 0 ? "sunday" : weekday === 6 ? "saturday" : "";

          return `<tr class="${date === selectedDate ? "selected-row" : ""}">
            <th scope="row">
              <button class="week-date ${color}" data-date="${date}">
                ${shortDate(date)}
                <small>${WEEKDAYS[weekday]}요일${date === dateKey() ? " · 오늘" : ""}</small>
              </button>
            </th>

            ${MEALS.map(meal => {
              const menu = state.meals[date]?.[meal] || "";
              const count = state.mealIngredients[date]?.[meal]?.length || 0;

              return `<td data-label="${meal}">
                <button class="week-menu ${menu ? "" : "empty-menu"}"
                  data-edit-meal="${date}">
                  ${esc(menu || "＋ 메뉴 기록")}
                  ${count ? `<small>재료 ${count}개</small>` : ""}
                </button>
              </td>`;
            }).join("")}

            <td>
              <button class="text-button" data-copy-meal="${date}"
                ${hasMeal(date) ? "" : "disabled"}>복사</button>
            </td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  </section>`;
}

/* 식단 입력 및 복사 */
function materialRow(name = "", quantity = "") {
  return `<div class="material-row">
    <input data-material-name maxlength="40" value="${esc(name)}"
      placeholder="재료 이름" aria-label="재료 이름">
    <input data-material-quantity maxlength="30" value="${esc(quantity)}"
      placeholder="예: 200g" aria-label="필요 수량">
    <button type="button" data-remove-material aria-label="재료 행 삭제">×</button>
  </div>`;
}

  openModal("하루 식단 계획하기", `

      <p class="help">
        ${date} · 메뉴를 비우면 해당 끼니의 재료도 함께 제외됩니다.
      </p>

      ${MEALS.map(meal => {
        const materials = state.mealIngredients[date]?.[meal] || [];

        return `<section class="meal-editor" data-meal-group="${meal}">
          <h3>${meal}</h3>

          <label class="field">
            메뉴

              value="${esc(meals[meal] || "")}"

      <input type="hidden" name="source" value="${source}">

function updateCopyPreview() {
  const form = $("#copy-form");
  if (!form) return;

  const date = $("[name=target]", form).value;

  $("#copy-preview").textContent = hasMeal(date)
    ? "이 날짜에는 이미 식단이 있어요. 교체하려면 아래 항목에 체크해 주세요."
    : "기록된 식단이 없는 날짜입니다.";
}

/* 기간별 식단 재료 합산 */
function groupedIngredients(dates) {
  const map = new Map();

  for (const date of dates) {
    for (const meal of MEALS) {
      for (const item of state.mealIngredients[date]?.[meal] || []) {
        const key = normalize(item.name);

        if (!map.has(key)) {
          map.set(key, { key, name: item.name, entries: [] });
        }

        map.get(key).entries.push({
          date,
          meal,
          quantity: item.quantity
        });
      }
    }
  }

  return [...map.values()];
}

function quoteSignature() {
  return JSON.stringify({ today: dateKey(), state });
}

function openPlanShopping(start, end = start) {
  const dates = rangeDates(start, end);
  const groups = groupedIngredients(dates);

  if (!groups.length) {
    return showToast("선택한 기간의 식단에 필요한 재료를 먼저 기록해 주세요.");
  }

  const stock = availableIngredients();

  const quoted = groups.map(group => {
    const pending = state.shopping.filter(item =>
      !item.done && normalize(item.name) === group.key
    );

    const calculation = Q.shortage(
      group.entries.map(item => item.quantity),
      stock.filter(item => normalize(item.name) === group.key)
        .map(item => item.quantity),
      pending.map(item => item.quantity)
    );

    const mode = calculation
      ? pending.length ? "increase" : "add"
      : pending.length > 1 ? "blocked"
      : pending.length === 1 ? "replace"
      : "manual";

    return {
      ...group,
      calculation,
      mode,
      targetId: pending[0]?.id || "",
      proposal: calculation
        ? calculation.extra > 0
          ? Q.format(calculation.extra, calculation.unit)
          : ""
        : pending.length === 1 ? pending[0].quantity : ""
    };
  });

  const countedDays = dates.filter(hasMeal).length;

  openModal("식단 재료를 장보기로", `
    <div class="summary-box">
      <strong>${start === end ? start : `${start} ~ ${end}`}</strong><br>
      식단 ${countedDays}일 · 재료 ${quoted.length}종 합산
    </div>

    <p class="help">
      선택한 기간 전체의 필요량에서 현재 냉장고 수량과 미구매 장보기 수량을 제외합니다.
      기한이 지난 재료는 계산에서 제외해요.
    </p>

    <form id="plan-form">
      ${quoted.map((group, index) => {
        const result = group.calculation;
        const checked = result && result.extra > 0;
        const details = group.entries.slice(0, 6).map(entry =>
          `${shortDate(entry.date)} ${entry.meal} ${entry.quantity}`
        ).join(" · ");

        return `<section class="plan-item">
          <label>
            <input type="checkbox" name="selected" value="${index}"
              ${checked ? "checked" : ""}
              ${group.mode === "blocked" ? "disabled" : ""}>
            ${esc(group.name)}
          </label>

          <p>
            ${esc(details)}
            ${group.entries.length > 6 ? ` 외 ${group.entries.length - 6}건` : ""}
          </p>

          ${result ? `
            <p>
              총 필요 ${Q.format(result.total, result.unit)}
              · 냉장고 ${Q.format(result.stock, result.unit)}
              · 장보기 반영 ${Q.format(result.cart, result.unit)}
            </p>
            <p>${result.extra > 0
              ? `추가 필요량: ${Q.format(result.extra, result.unit)}`
              : "현재 냉장고와 장보기 목록으로 준비할 수 있어요."}</p>
          ` : `
            <p class="warning">
              단위가 다르거나 수량 설명을 자동 계산하기 어려워요.
              필요한 구매량을 직접 확인해 주세요.
            </p>
          `}

          ${group.mode === "blocked"
            ? `<p class="warning">
                같은 재료의 장보기 항목이 여러 개 있어요.
                장보기에서 수량을 정리한 뒤 다시 합산해 주세요.
              </p>`
            : `<label class="field">
                ${group.mode === "replace"
                  ? "기존 장보기 항목의 최종 수량"
                  : group.mode === "increase"
                    ? "기존 장보기 수량에 더할 양"
                    : "장보기에 추가할 수량"}
                <input name="quantity-${index}" maxlength="30"
                  value="${esc(group.proposal)}"
                  placeholder="${result ? "예: 200g" : "수량 직접 확인"}">
              </label>`}
        </section>`;
      }).join("")}

      <p class="help">
        g↔kg, ml↔L은 환산하지만 팩·봉·개와 무게 사이의 환산은 하지 않습니다.
        같은 냉장고 재료는 선택한 기간의 합산에서 한 번만 계산합니다.
        기간을 따로 나눠 여러 번 계산하면 재고가 다시 반영될 수 있으므로,
        함께 준비할 날짜는 한 번에 선택해 주세요.
      </p>

      <div class="form-actions">
        <button type="button" class="button outline" data-action="close-modal">취소</button>
        <button class="button">선택한 재료 반영</button>
      </div>
    </form>
  `);

  currentQuote = {
    start,
    end,
    groups: quoted,
    signature: quoteSignature()
  };
}

function submitPlanShopping(form) {
  if (!currentQuote) throw new Error("다시 합산해 주세요.");

  if (currentQuote.signature !== quoteSignature()) {
    const { start, end } = currentQuote;
    openPlanShopping(start, end);
    showToast("데이터가 변경되어 다시 계산했어요. 수량을 확인해 주세요.");
    return;
  }

  const data = new FormData(form);
  const selected = data.getAll("selected");

  if (!selected.length) throw new Error("반영할 재료를 선택해 주세요.");

  const next = clone(state);

  for (const selectedIndex of selected) {
    const index = Number(selectedIndex);
    const group = currentQuote.groups[index];

    if (!group || group.mode === "blocked") continue;

    const quantity = String(data.get(`quantity-${index}`) || "").trim();

    if (!quantity || quantity.length > 30 || !positiveQuantity(quantity)) {
      throw new Error(`${group.name} 수량을 확인해 주세요.`);
    }

    const amount = Q.parse(quantity);

    if (
      group.calculation &&
      (!amount || amount.amount <= 0 || amount.unit !== group.calculation.unit)
    ) {
      throw new Error(`${group.name}은 계산된 수량과 같은 종류의 단위를 입력해 주세요.`);
    }

    if (group.mode === "increase") {
      const item = next.shopping.find(
        row => row.id === group.targetId && !row.done
      );

      if (!item) throw new Error("기존 장보기 항목을 다시 확인해 주세요.");
      item.quantity = Q.merge(item.quantity, quantity);
    } else if (group.mode === "replace") {
      const item = next.shopping.find(
        row => row.id === group.targetId && !row.done
      );

      if (!item) throw new Error("기존 장보기 항목을 다시 확인해 주세요.");
      item.quantity = quantity;
    } else {
      const duplicate = next.shopping.some(item =>
        !item.done && normalize(item.name) === group.key
      );

      if (duplicate) throw new Error(`${group.name}이 이미 장보기에 있어요.`);

      next.shopping.push({
        id: uid(),
        name: group.name,
        quantity,
        done: false
      });
    }
  }

  if (commit(next, "식단에 필요한 재료를 장보기에 반영했어요.")) {
    closeModal();
  }
}

            <input type="checkbox" data-check="${esc(item.id)}"

          <div class="row-actions">

function openCartEditor(id) {
  const item = state.shopping.find(row => row.id === id);

  if (!item) return;

  if (item.registeredAt) {
    return showToast("등록 완료된 재료는 냉장고에서 수량을 수정해 주세요.");
  }

  openModal("장보기 수량 수정", `
    <form id="cart-quantity-form">
      <input type="hidden" name="id" value="${esc(id)}">
      <p style="margin-bottom:18px"><strong>${esc(item.name)}</strong></p>

      <div class="field">
        <span>최종 구매 수량</span>
        ${quantityEditor(item.quantity)}
      </div>

      <div class="form-actions">
        <button type="button" class="button outline" data-action="close-modal">취소</button>
        <button class="button">수량 저장</button>
      </div>
    </form>
  `);

  syncQuantity($("[data-quantity-editor]", $("#modal")));
}

/* 구매한 재료를 냉장고에 등록 */
function mergeCandidates(item) {
  const amount = Q.parse(item.quantity);
  if (!amount || amount.amount <= 0) return [];

  return state.ingredients.filter(stock => {
    const stockAmount = Q.parse(stock.quantity);

    return normalize(stock.name) === normalize(item.name) &&
      remainingDays(stock.expiry) >= 0 &&
      stockAmount && stockAmount.amount > 0 &&
      stockAmount.unit === amount.unit;
  });
}

function openRegisterForm(id) {
  const item = state.shopping.find(row => row.id === id);

  if (!item || !item.done) {
    return showToast("구매 완료한 재료부터 등록할 수 있어요.");
  }

  if (item.registeredAt) {
    return showToast("이미 냉장고에 등록한 항목이에요.");
  }

  const candidates = mergeCandidates(item);
  const existing = state.ingredients.find(
    stock => normalize(stock.name) === normalize(item.name)
  );

  openModal("구매한 재료를 냉장고에", `
    <form id="register-form">
      <input type="hidden" name="id" value="${esc(id)}">

      <div class="summary-box">
        <strong>${esc(item.name)}</strong><br>
        등록할 구매 수량 ${esc(item.quantity)}
      </div>

      <label class="field">
        분류
        <select name="category">
          ${CATEGORIES.map(category => `
            <option ${category === (existing?.category || "기타") ? "selected" : ""}>
              ${category}
            </option>
          `).join("")}
        </select>
      </label>

      <label class="field">
        구매한 재료의 유통기한
        <input type="date" name="expiry" value="${futureDate(7)}"
          min="${dateKey()}" max="2100-12-31" required>
      </label>

      <p class="help">
        기본 날짜는 입력 예시입니다. 제품에 표시된 실제 날짜로 수정해 주세요.
      </p>

      <label class="field">
        등록 방법
        <select name="target">
          <option value="">새 항목으로 등록 · 유통기한 따로 관리</option>

          ${candidates.map(stock => `

      </label>

      <p class="help">
        기본값은 새 항목 등록입니다.
        같은 재료를 합치면 수량을 더하고, 두 유통기한 중 더 이른 날짜를 유지합니다.
        합치는 경우 기존 항목의 분류도 유지해요.<br>
        등록 완료한 장보기 항목은 다시 등록할 수 없습니다.
      </p>

      <div class="form-actions">
        <button type="button" class="button outline" data-action="close-modal">취소</button>
        <button class="button">냉장고에 등록</button>
      </div>
    </form>
  `);
}

/* 백업 및 복원 */
function downloadText(value, name) {
  const blob = new Blob([value], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportBackup() {
  if (blocked) {
    return showToast("보존 중인 원본 파일을 먼저 받아 주세요.");
  }

  downloadText(JSON.stringify({
    kind: "fresh-note",
    version: 3,
    exportedAt: new Date().toISOString(),
    data: state
  }, null, 2), `fresh-note-${dateKey()}.json`);
}

$("#import-file").addEventListener("change", async event => {
  const file = event.target.files[0];
  event.target.value = "";

  const sequence = ++importSequence;

  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    return showToast("백업 파일은 5MB 이하만 가져올 수 있어요.");
  }

  try {
    const raw = JSON.parse(await file.text());
    if (sequence !== importSequence) return;

    const restored = validateState(
      raw.kind === "fresh-note" ? raw.data : raw
    );

    openModal("백업 데이터 가져오기", `
      <p>현재 데이터를 아래 백업 내용으로 교체합니다.</p>

      <p class="help">
        식재료 ${restored.ingredients.length}개 ·
        장보기 ${restored.shopping.length}개 ·
        식단 ${Object.keys(restored.meals).length}일
      </p>

      <p class="help">현재 데이터가 필요하다면 먼저 백업해 주세요.</p>

      <div class="form-actions">
        <button class="button outline" data-action="close-modal">취소</button>
        <button class="button" data-action="confirm-import">백업으로 교체</button>
      </div>
    `);

    pendingImport = restored;
  } catch (error) {
    showToast(`가져오지 못했어요. ${error.message}`);
  }
});

/* 클릭 이벤트 */
document.addEventListener("click", event => {
  const target = event.target.closest("button, a");
  if (!target || target.disabled) return;

  try {
    handleClick(target);
  } catch (error) {
    showToast(error.message);
  }
});

function handleClick(target) {
  const action = target.dataset.action;

  if (target.dataset.stat !== undefined) {
    view.status = ["urgent", "soon", "fresh", "expired"][
      Number(target.dataset.stat)
    ];
    view.query = "";
    view.category = "전체";

    if (currentPage() === "ingredients") render();
  }

  if (action === "close-modal") closeModal();
  if (action === "add-ingredient") openIngredientForm();
  if (action === "export") exportBackup();
  if (action === "import") $("#import-file").click();

  if (action === "calendar-today") {
    selectDate(dateKey());
    render();
  }

  if (action === "range-this-week") {
    const start = weekStart(selectedDate);
    const end = addDays(start, 6);

    if (
      !Number.isFinite(dayNumber(start)) ||
      !Number.isFinite(dayNumber(end))
    ) {
      throw new Error("선택 가능한 날짜 범위를 확인해 주세요.");
    }

    rangeStart = start;
    rangeEnd = end;
    render();
  }

  if (action === "export-original" && rawOriginal !== null) {
    downloadText(rawOriginal, `fresh-note-original-${dateKey()}.json`);
  }

  if (action === "reset-storage") {
    if (confirm("보존 중인 기존 데이터를 빈 데이터로 교체할까요? 필요한 경우 먼저 원본 파일을 받아 주세요.")) {
      commit(emptyState(), "빈 냉장고로 시작했어요.", false, true);
    }
  }

  if (action === "confirm-import" && pendingImport) {
    requireFreshModal();

    const next = pendingImport;
    if (commit(next, "백업 데이터를 가져왔어요.", !blocked, true)) {
      closeModal();
    }
  }

  if (action === "undo" && undoRecord) {
    if (JSON.stringify(state) !== undoRecord.after) {
      throw new Error("데이터가 변경되어 이전 작업을 되돌릴 수 없어요.");
    }

    const before = undoRecord.before;
    commit(before, "이전 상태로 되돌렸어요.", false);
  }

  if (action === "sample") {
    if (state.ingredients.length) {
      throw new Error("예시 재료는 빈 냉장고에서만 추가할 수 있어요.");
    }

    const next = clone(state);

    next.ingredients = [
      {
        id: uid(), name: "대파", category: "채소",
        quantity: "2대", expiry: futureDate(2), emoji: "🥬"
      },
      {
        id: uid(), name: "계란", category: "육류",
        quantity: "6개", expiry: futureDate(7), emoji: "🥚"
      },
      {
        id: uid(), name: "닭가슴살", category: "육류",
        quantity: "200g", expiry: futureDate(3), emoji: "🍗"
      }
    ];

    commit(next, "예시 재료 3개를 추가했어요.");
  }

  if (target.dataset.edit) openIngredientForm(target.dataset.edit);
  if (target.dataset.consume) openConsumeForm(target.dataset.consume);
  if (target.dataset.editMeal) openMealForm(target.dataset.editMeal);
  if (target.dataset.copyMeal) openCopyForm(target.dataset.copyMeal);
  if (target.dataset.dayShopping) openPlanShopping(target.dataset.dayShopping);
  if (target.dataset.cartEdit) openCartEditor(target.dataset.cartEdit);
  if (target.dataset.register) openRegisterForm(target.dataset.register);

  if (target.dataset.category) {
    view.category = target.dataset.category;
    render();
  }

  if (target.dataset.calendarView) {
    view.calendar = target.dataset.calendarView;
    render();
  }

  if (target.dataset.month) {
    const next = new Date(
      calendarMonth.getFullYear(),
      calendarMonth.getMonth() + Number(target.dataset.month),
      1
    );

    if (next.getFullYear() < 2000 || next.getFullYear() > 2100) return;

    selectDate(dateKey(next));
    render();
  }

  if (target.dataset.week) {
    const next = addDays(selectedDate, Number(target.dataset.week) * 7);
    if (!Number.isFinite(dayNumber(next))) return;

    selectDate(next);
    render();
  }

  if (target.dataset.date) {
    selectDate(target.dataset.date);
    render();
  }

  if (target.dataset.use || target.dataset.delete) {
    const id = target.dataset.use || target.dataset.delete;
    const item = state.ingredients.find(row => row.id === id);
    if (!item) return;

    const next = clone(state);
    next.ingredients = next.ingredients.filter(row => row.id !== id);

    commit(next, target.dataset.use
      ? `${item.name} 사용을 완료했어요.`
      : `${item.name}을 냉장고에서 삭제했어요.`);
  }

  if (target.dataset.cartDelete) {
    const next = clone(state);
    next.shopping = next.shopping.filter(
      row => row.id !== target.dataset.cartDelete
    );
    commit(next, "장보기 항목을 삭제했어요.");
  }

  if (action === "clear-shopping") {
    const pendingRegistration = state.shopping.filter(
      item => item.done && !item.registeredAt
    ).length;

    if (
      pendingRegistration &&
      !confirm(`냉장고에 등록하지 않은 구매 완료 항목 ${pendingRegistration}개도 삭제됩니다. 정리할까요?`)
    ) return;

    const next = clone(state);
    next.shopping = next.shopping.filter(row => !row.done);

    commit(next, "구매 완료 항목을 정리했어요.");
  }

  if (target.dataset.addMaterial) {
    const section = target.closest("[data-meal-group]");
    const list = $("[data-material-list]", section);

    if (list.children.length >= 10) {
      throw new Error("한 끼당 재료는 10개까지 추가할 수 있어요.");
    }

    list.insertAdjacentHTML("beforeend", materialRow());
    list.lastElementChild.querySelector("input").focus();
  }

  if (target.hasAttribute("data-remove-material")) {
    target.closest(".material-row").remove();
  }

  if (target.dataset.quantityMode) {
    const editor = target.closest("[data-quantity-editor]");
    const mode = target.dataset.quantityMode;

    editor.dataset.mode = mode;
    $(".quantity-standard", editor).hidden = mode !== "standard";
    $("[data-quantity-custom]", editor).hidden = mode !== "custom";

    editor.querySelectorAll("[data-quantity-mode]").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.quantityMode === mode
      );
    });

    syncQuantity(editor);
    updateConsumePreview();
  }
}

/* 입력 및 변경 이벤트 */
document.addEventListener("input", event => {
  const input = event.target;

  if (input.id === "ingredient-search") {
    view.query = input.value;
    updateIngredientResults();
  }

  const editor = input.closest("[data-quantity-editor]");

  if (editor) {
    syncQuantity(editor);
    updateConsumePreview();
  }

  if (input.form?.id === "copy-form") updateCopyPreview();
});

document.addEventListener("change", event => {
  const input = event.target;

  if (input.id === "ingredient-sort") {
    view.sort = input.value;
    updateIngredientResults();
  }

  if (input.id === "ingredient-status") {
    view.status = input.value;
    updateIngredientResults();
  }

  if (input.form?.id === "range-form") {
    if (input.name === "start") rangeStart = input.value;
    if (input.name === "end") rangeEnd = input.value;
  }

  if (input.form?.id === "copy-form") updateCopyPreview();

  const editor = input.closest("[data-quantity-editor]");

  if (editor) {
    syncQuantity(editor);
    updateConsumePreview();
  }

  if (input.dataset.check) {
    const next = clone(state);
    const item = next.shopping.find(
      row => row.id === input.dataset.check
    );

    if (!item || item.registeredAt) return;

    item.done = input.checked;

    if (!commit(
      next,
      item.done ? "구매 완료로 표시했어요." : "미구매로 변경했어요."
    )) render();
  }
});

/* 폼 제출 */
document.addEventListener("submit", event => {
  const form = event.target;

  if (![
    "ingredient-form",
    "consume-form",
    "meal-form",
    "copy-form",
    "shopping-form",
    "discovery-form",
    "plan-form",
    "cart-quantity-form",
    "register-form",
    "range-form"
  ].includes(form.id)) return;

  event.preventDefault();

  try {
    submitForm(form);
  } catch (error) {
    showToast(error.message);
  }
});

function submitForm(form) {
  if (blocked && form.id !== "discovery-form") {
    throw new Error("기존 저장 데이터를 먼저 복구하거나 백업해 주세요.");
  }

  const editor = $("[data-quantity-editor]", form);

  if (editor && (!syncQuantity(editor) || !form.reportValidity())) return;

  if ($("#modal").contains(form) && form.id !== "plan-form") {
    requireFreshModal();
  }

  const data = new FormData(form);

  if (form.id === "ingredient-form") {
    const id = String(data.get("id") || "");
    const name = String(data.get("name") || "").trim();
    const category = String(data.get("category") || "");
    const quantity = String(data.get("quantity") || "").trim();
    const expiry = String(data.get("expiry") || "");

    if (
      !name || !positiveQuantity(quantity) ||
      !Number.isFinite(dayNumber(expiry))
    ) {
      throw new Error("식재료 이름, 수량과 날짜를 확인해 주세요.");
    }

    const next = clone(state);
    const index = next.ingredients.findIndex(item => item.id === id);
    const previous = index >= 0 ? next.ingredients[index] : null;

    const item = {
      id: previous?.id || uid(),
      name,
      category,
      quantity,
      expiry,
      emoji: previous?.category === category
        ? previous.emoji : emojiFor(category)
    };

    if (index >= 0) next.ingredients[index] = item;
    else next.ingredients.unshift(item);

    if (commit(
      next,
      index >= 0 ? "식재료를 수정했어요." : "식재료를 추가했어요."
    )) closeModal();
  }

  if (form.id === "consume-form") {
    const id = String(data.get("id"));
    const quantity = String(data.get("quantity") || "");
    const next = clone(state);
    const item = next.ingredients.find(row => row.id === id);

    if (!item) throw new Error("사용량을 기록할 재료가 없어요.");

    const left = Q.consume(item.quantity, quantity);

    if (left) item.quantity = left;
    else next.ingredients = next.ingredients.filter(row => row.id !== id);

    if (commit(next, left
      ? `${item.name} 사용량을 반영했어요. 남은 수량 ${left}`
      : `${item.name}을 모두 사용했어요.`)) closeModal();
  }

  if (form.id === "cart-quantity-form") {
    const id = String(data.get("id"));
    const quantity = String(data.get("quantity") || "").trim();
    const next = clone(state);
    const item = next.shopping.find(row => row.id === id);

    if (!item || item.registeredAt) {
      throw new Error("냉장고 등록 여부를 확인해 주세요.");
    }

    item.quantity = quantity;
    if (commit(next, "장보기 수량을 수정했어요.")) closeModal();
  }

  if (form.id === "shopping-form") {
    const name = String(data.get("name") || "").trim();
    const quantity = String(data.get("quantity") || "").trim();

    if (!name || !positiveQuantity(quantity)) {
      throw new Error("재료 이름과 수량을 확인해 주세요.");
    }

    const duplicate = state.shopping.some(item =>
      !item.done && normalize(item.name) === normalize(name)
    );

    if (duplicate) {
      throw new Error("이미 미구매 목록에 있어요. 기존 항목의 수량을 수정해 주세요.");
    }

    const next = clone(state);
    next.shopping.push({ id: uid(), name, quantity, done: false });

    if (commit(next, "장보기에 추가했어요.")) {
      $("#shopping-form [name=name]")?.focus();
    }
  }

  if (form.id === "register-form") {
    const id = String(data.get("id"));
    const expiry = String(data.get("expiry") || "");
    const category = String(data.get("category") || "");
    const targetId = String(data.get("target") || "");

    if (
      !Number.isFinite(dayNumber(expiry)) ||
      remainingDays(expiry) < 0
    ) {
      throw new Error("오늘 이후의 실제 유통기한을 확인해 주세요.");
    }

    const next = clone(state);
    const purchased = next.shopping.find(item => item.id === id);

    if (!purchased || !purchased.done || purchased.registeredAt) {
      throw new Error("구매 완료 및 냉장고 등록 상태를 확인해 주세요.");
    }

    if (!positiveQuantity(purchased.quantity)) {
      throw new Error("구매 수량을 먼저 수정해 주세요.");
    }

    if (targetId) {
      const allowed = mergeCandidates(purchased).some(
        item => item.id === targetId
      );

      if (!allowed) {
        throw new Error("합칠 수 있는 냉장고 항목을 다시 확인해 주세요.");
      }

      const target = next.ingredients.find(item => item.id === targetId);
      target.quantity = Q.merge(target.quantity, purchased.quantity);
      target.expiry = target.expiry < expiry ? target.expiry : expiry;
    } else {
      next.ingredients.unshift({
        id: uid(),
        name: purchased.name,
        quantity: purchased.quantity,
        category,
        expiry,
        emoji: emojiFor(category)
      });
    }

    purchased.registeredAt = new Date().toISOString();

    if (commit(next, targetId
      ? "기존 재료에 수량을 합쳤어요. 더 이른 유통기한을 유지했어요."
      : "구매한 재료를 냉장고에 등록했어요.")) closeModal();
  }

  if (form.id === "discovery-form") {
    view.extra = String(data.get("extra") || "").trim();
    render();
    showToast("검색 조건을 적용했어요.");
  }

  if (form.id === "meal-form") {
    const date = String(data.get("date"));
    const menus = {};
    const materials = {};

    for (const meal of MEALS) {
      const menu = String(data.get(meal) || "").trim();
      menus[meal] = menu;

      if (!menu) continue;

      const section = form.querySelector(`[data-meal-group="${meal}"]`);
      const rows = [...section.querySelectorAll(".material-row")];
      const list = [];
      const seen = new Set();

      for (const row of rows) {
        const name = $("[data-material-name]", row).value.trim();
        const rawQuantity = $("[data-material-quantity]", row).value.trim();

        if (!name && !rawQuantity) continue;
        if (!name) throw new Error(`${meal} 재료 이름을 입력해 주세요.`);

        const quantity = rawQuantity || "분량 확인";
        if (!positiveQuantity(quantity)) {
          throw new Error(`${name} 수량을 확인해 주세요.`);
        }

        const key = normalize(name);
        if (seen.has(key)) {
          throw new Error(`${meal}에 ${name}이 중복되어 있어요.`);
        }

        seen.add(key);
        list.push({ name, quantity });
      }

      if (list.length) materials[meal] = list;
    }

    const next = clone(state);

    if (Object.values(menus).some(Boolean)) next.meals[date] = menus;
    else delete next.meals[date];

    if (Object.keys(materials).length) next.mealIngredients[date] = materials;
    else delete next.mealIngredients[date];

    if (commit(next, "식단과 필요한 재료를 저장했어요.")) closeModal();
  }

  if (form.id === "copy-form") {
    const source = String(data.get("source"));
    const target = String(data.get("target"));

    if (
      !Number.isFinite(dayNumber(target)) ||
      source === target || !hasMeal(source)
    ) {
      throw new Error("서로 다른 날짜를 선택해 주세요.");
    }

    if (hasMeal(target) && data.get("replace") !== "yes") {
      throw new Error("기존 식단을 교체하려면 교체 항목에 체크해 주세요.");
    }

    const next = clone(state);
    next.meals[target] = clone(state.meals[source]);

    if (state.mealIngredients[source]) {
      next.mealIngredients[target] = clone(state.mealIngredients[source]);
    } else {
      delete next.mealIngredients[target];
    }

    selectDate(target);

    if (commit(
      next,
      `${shortDate(target)}에 식단과 재료를 복사했어요.`
    )) closeModal();
  }

  if (form.id === "range-form") {
    const start = String(data.get("start"));
    const end = String(data.get("end"));

    rangeDates(start, end);
    rangeStart = start;
    rangeEnd = end;
    openPlanShopping(start, end);
  }

  if (form.id === "plan-form") submitPlanShopping(form);
}

/* 다른 탭 및 날짜 변경 반영 */
window.addEventListener("storage", event => {
  if (event.key !== STORAGE_KEY || blocked) return;

  try {
    const next = event.newValue
      ? validateState(JSON.parse(event.newValue))
      : emptyState();

    state = next;
    undoRecord = null;
    render();

    if ($("#modal").open) {
      showToast("다른 탭의 변경 내용을 반영했어요. 입력 창을 다시 열어 확인해 주세요.");
    }
  } catch {
    showToast("다른 탭의 데이터 형식을 확인할 수 없어 반영하지 않았어요.");
  }
});

window.addEventListener("hashchange", () => {
  closeModal();
  render();
  window.scrollTo(0, 0);

  if (currentPage() !== "landing") {
    $("#app-main").focus({ preventScroll: true });
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("#modal").open) render();
});

let lastDate = dateKey();

setInterval(() => {
  const current = dateKey();

  if (current !== lastDate) {
    lastDate = current;
    if (!$("#modal").open) render();
  }
}, 60000);

render();
</script>
