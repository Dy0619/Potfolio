<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0b1426">
<title>D.Lune · Reactive Water</title>

<style>
:root{
  color-scheme:dark;
  --bg:#1b2540;
  --text:#f5f4fc;
  --muted:#d6ddf0;
  --gold:#ead1ac;
  --line:#d3d9f03d;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Malgun Gothic",sans-serif;
}
body.is-intro{overflow:hidden}
html{scroll-padding-top:110px}
button,a,select{-webkit-tap-highlight-color:transparent}
button,select{font:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation}
a[href],select,[role=button],[role=tab]{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:6px;
}
[hidden]{display:none!important}
a{color:inherit}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}
.eyebrow{
  color:var(--gold);
  font-size:11px;
  letter-spacing:.12em;
  line-height:1.8;
}
.muted{color:var(--muted)}

#pageBackdrop{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 9% 8%,#849be963,transparent 56%),
    radial-gradient(ellipse at 90% 33%,#ad85bc4f,transparent 55%),
    radial-gradient(ellipse at 40% 100%,#66b9bd3d,transparent 63%),
    linear-gradient(135deg,#253655,#2b304f 52%,#284459);
}
#ambient{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  z-index:0;
  opacity:.55;
  pointer-events:none;
}

header{
  position:fixed;
  inset:0 0 auto;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:24px 5%;
  background:linear-gradient(#1b2540f5,#1b2540cf 65%,transparent);
}
.brand{
  border:0;
  padding:0;
  background:none;
  font-size:19px;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:8px;
  font-size:8px;
  font-weight:400;
  letter-spacing:.1em;
  color:var(--muted);
}
nav{display:flex;align-items:center;gap:9px}
.nav-link{
  border:0;
  background:none;
  padding:10px;
  color:var(--muted);
  font-size:11px;
}
.round{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:50%;
  background:none;
  color:var(--gold);
}
.round[aria-pressed=false]{opacity:.5}
select{
  max-width:120px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--bg);
  color:var(--gold);
  font-size:10px;
}

main{
  position:relative;
  z-index:1;
  max-width:1280px;
  margin:auto;
  padding:0 7%;
  opacity:0;
  transition:opacity .8s;
}
body.ready main{opacity:1}
.hero{
  position:relative;
  display:flex;
  align-items:center;
  min-height:60svh;
  padding:135px 0 28px;
}
.hero h1{
  font-size:clamp(34px,4.4vw,60px);
  line-height:1.35;
  letter-spacing:-.05em;
  font-weight:400;
  margin:18px 0;
}
.hero p:not(.eyebrow){
  font-size:14px;
  line-height:2.1;
  color:var(--muted);
}
.text-button{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:35px;
  padding:15px 0;
  border:0;
  border-bottom:1px solid var(--line);
  background:none;
  color:var(--gold);
  font-size:13px;
}
.hero .text-button{margin-top:24px}
.hero-beam{
  position:absolute;
  bottom:0;
  left:50%;
  width:1px;
  height:120px;
  background:linear-gradient(transparent,var(--gold));
  opacity:.7;
}

/* 폴더와 중앙 연결선 */
.timeline{position:relative;padding:20px 0 80px}
.track{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  transform:translateX(-50%);
  background:#ead1ac25;
  pointer-events:none;
}
.track>span{
  display:block;
  position:relative;
  left:-1px;
  width:4px;
  height:100%;
  border-radius:4px;
  background:linear-gradient(#ead1ac40,#edbf85 72%,#fff6dd);
  transform-origin:top;
  transform:scaleY(0);
  box-shadow:0 0 10px #ead1ac99,0 0 24px #edb76d55;
}
.track-head{
  position:absolute;
  left:50%;
  top:0;
  width:18px;
  height:26px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,#fffef4 15%,#ffe7ac 45%,#edb76d80 72%,transparent);
  box-shadow:0 0 16px #fff1c8cc,0 0 36px #edb76d99;
  pointer-events:none;
  z-index:2;
}
.track-head::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:8px;
  width:48px;
  height:135px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 100%,#fff0ca70, #edb76d28 38%,transparent 72%);
}
.track-head::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:42px;
  height:2px;
  transform:translate(-50%,-50%);
  background:linear-gradient(90deg,transparent,#fff7df,transparent);
  box-shadow:0 0 9px #fff0ca99;
}
.timeline.light-muted .track>span{width:2px;left:0;box-shadow:none;background:#c4af84}
.timeline.light-muted .track-head{display:none}
.timeline.light-muted .node{box-shadow:none}
.timeline.light-muted .node::before{opacity:0}
.timeline.light-muted .node-ring,.timeline.light-muted .node-spark,
.timeline.light-muted .node::after{display:none}
.node-ring,.node-spark{position:absolute;pointer-events:none;opacity:0}
.node-ring{
  inset:-5px;
  border:1px solid #ffe4ae;
  border-radius:50%;
  box-shadow:0 0 12px #edb76d66,inset 0 0 10px #ead1ac44;
}
.node-ring.secondary{border-color:#c8ddfa;box-shadow:0 0 14px #adc9f855}
.node-spark{
  left:50%;top:50%;width:4px;height:4px;
  border-radius:50%;background:#fff0ce;
  box-shadow:0 0 9px #ffe3a9;
  transform:translate(-50%,-50%) rotate(var(--angle)) translateX(5px);
}
.node-spark:nth-of-type(3n){background:#cbdcff;box-shadow:0 0 9px #bacdfb}
.node.is-arriving::after{animation:node-flare 1.3s ease-out both}
.node.is-arriving .node-ring{animation:node-ring 1.25s cubic-bezier(.16,.7,.2,1) both}
.node.is-arriving .node-ring.secondary{animation-delay:.16s}
.node.is-arriving .node-spark{animation:node-spark 1.05s var(--delay) ease-out both}
@keyframes node-flare{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  18%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
}
@keyframes node-ring{
  0%{opacity:0;transform:scale(.5)}
  12%{opacity:.85}
  100%{opacity:0;transform:scale(5)}
}
@keyframes node-spark{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(7px) scale(.4)}
  18%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(var(--radius)) scale(.2)}
}
.folder-row{
  position:relative;
  padding:70px 0;
  scroll-margin-top:110px;
}
.folder-row:first-of-type{padding-top:20px}
.row-trigger{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14%;
  align-items:center;
  min-height:290px;
}
.node{
  position:absolute;
  left:50%;
  top:50%;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#9c97a1;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px #c4af8422;
  pointer-events:none;
}
.node::before{
  content:"";
  position:absolute;
  inset:-6px;
  border:1px solid #ead1ac38;
  border-radius:50%;
}
.node::after{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:100px;height:100px;
  border-radius:50%;
  background:radial-gradient(circle,#fff2cd99,#edbf8540 28%,#bacdfb15 52%,transparent 72%);
  opacity:0;
  pointer-events:none;
}
.node.is-reached{
  background:#fff1cf;
  box-shadow:0 0 12px #ffe4a9cc,0 0 28px #edb76d66;
}
.folder-control{
  position:relative;
  display:block;
  width:100%;
  max-width:390px;
  height:250px;
  margin:auto;
  border:0;
  background:none;
  text-align:left;
  perspective:900px;
  isolation:isolate;
}
.folder-tab{
  position:absolute;
  top:10px;
  left:0;
  width:52%;
  height:44px;
  padding:12px 20px;
  background:#68739e;
  border:1px solid #d6d9f263;
  border-radius:10px 15px 0 0;
  font-size:9px;
  letter-spacing:.1em;
}
.folder-sheet{
  position:absolute;
  inset:36px 18px 15px;
  background:#f2e9d8;
  border-radius:5px;
  transform:rotate(-3deg);
  transition:transform .42s var(--ease);
}
.folder-sheet i{
  display:block;
  height:1px;
  margin:24px;
  background:#6b64813d;
}
.folder-cover{
  position:absolute;
  inset:51px 0 0;
  display:flex;
  flex-direction:column;
  padding:25px 26px 20px;
  background:linear-gradient(125deg,#535f87,#343f65);
  border:1px solid #c8d2f060;
  border-radius:5px 14px 14px 14px;
  box-shadow:0 18px 40px #0003;
  transform-origin:bottom;
  transition:transform .32s var(--ease),border-color .3s,box-shadow .3s;
}
.folder-number{color:#f1ddbd;font-size:10px}
.folder-cover strong{
  margin:17px 0 9px;
  font-size:27px;
  font-weight:400;
}
.folder-description{font-size:11px;color:#b4b4a0}
.folder-meta{
  display:flex;
  justify-content:space-between;
  margin-top:auto;
  padding-top:18px;
  color:#e0e5f7;
  font-size:9px;
}
.folder-meta b{font-size:17px;font-weight:400}
.folder-control:hover .folder-cover{border-color:#c4af8480}
.folder-row.has-arrival .folder-cover{
  border-color:#ffe6b5aa;
  box-shadow:0 0 25px #edb76d22,0 18px 40px #0003;
}
.folder-control:hover .folder-sheet{
  transform:translateY(-4px) rotate(-2deg);
}
.folder-control.is-opening .folder-cover{
  transform:rotateX(-22deg) translateY(5px);
  border-color:#c4af84aa;
  box-shadow:0 22px 48px #0005;
}
.folder-control.is-opening .folder-sheet{transform:translateY(-18px)}
.folder-control.is-open .folder-cover{transform:rotateX(-8deg)}
.folder-control.is-open .folder-sheet{transform:translateY(-8px)}
.row-copy h2{
  font-size:clamp(23px,2.5vw,35px);
  font-weight:400;
  letter-spacing:-.04em;
  line-height:1.5;
  margin:15px 0;
}
.row-copy>p:not(.eyebrow){
  font-size:13px;
  line-height:2;
  color:var(--muted);
}
.row-hint{
  display:block;
  margin-top:25px;
  font-size:10px;
  color:#9b947e;
}
.folder-row:nth-of-type(even) .folder-control{
  grid-column:2;
  grid-row:1;
}
.folder-row:nth-of-type(even) .row-copy{
  grid-column:1;
  grid-row:1;
}
.enhanced .folder-control{
  opacity:0;
  transform:translateX(-45px) rotate(-2deg);
  transition:opacity .65s,transform .85s var(--ease);
}
.enhanced .folder-row:nth-of-type(even) .folder-control{
  transform:translateX(45px) rotate(2deg);
}
.enhanced .row-copy{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .65s .16s,transform .7s .16s var(--ease);
}
.enhanced .row-trigger.visible .folder-control,
.enhanced .folder-row:nth-of-type(even) .row-trigger.visible .folder-control,
.enhanced .row-trigger.visible .row-copy{
  opacity:1;
  transform:none;
}

/* 폴더 내용 */
.panel{

/* 인트로 */
#opening{
  position:fixed;
  inset:0;
  z-index:50;
  isolation:isolate;
  transform-origin:0% 50%;
  backface-visibility:hidden;
}
#opening::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  background:
    radial-gradient(ellipse at 50% 43%,#142039e8 0%,#19243cd9 34%,transparent 72%),
    radial-gradient(ellipse at 8% 12%,#667bb361,transparent 60%),
    radial-gradient(ellipse at 95% 70%,#8b72ab4d,transparent 62%),
    linear-gradient(135deg,#263654,#242c48 50%,#30475a);
  opacity:1;
  transition:opacity 1.1s var(--ease);
}
#opening::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  border:1px solid #f1debc44;
  box-shadow:inset -28px 0 42px #0003,inset -2px 0 0 #fff2e766;
  opacity:0;
  transition:opacity .2s;
}
#opening.is-turning{
  overflow:hidden;
  border-radius:10px;
  box-shadow:35px 8px 95px #0007;
  will-change:transform,opacity;
}
#opening.is-turning::after{opacity:1}
#opening.is-turning .opening-top{opacity:0;pointer-events:none}
body.is-paper-entry .folder-row:first-of-type .folder-control{
  transition-delay:.08s;
}
body.is-paper-entry .folder-row:first-of-type .row-copy{
  transition-delay:.22s;
}
#introCanvas{
  position:absolute;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
}
.opening-top{
  position:absolute;
  top:30px;
  left:5%;
  right:5%;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
  transition:opacity .4s;
}
.opening-top strong{font-size:17px;letter-spacing:.04em}
.opening-top small{
  display:block;
  margin-top:10px;
  font-size:9px;
  color:var(--muted);
}
.opening-actions{display:flex;gap:10px;align-items:center}
.opening-actions button{
  background:none;
  border:1px solid var(--line);
  border-radius:24px;
  padding:10px 14px;
  color:var(--muted);
  font-size:11px;
}
#introCaption{
  position:absolute;
  z-index:2;
  left:8%;
  right:8%;
  bottom:25%;
  text-align:center;
  font-size:clamp(13px,1.5vw,18px);
  color:#ede6dc;
  opacity:0;
}

/* 상세 창 */
dialog{
  width:min(720px,90vw);
  max-height:85dvh;
  padding:30px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#222d4a;
  color:var(--text);
  overflow:auto;
}
dialog::backdrop{background:#000a;backdrop-filter:blur(10px)}
.dialog-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  color:var(--gold);
  font-size:10px;
}
dialog h2{font-size:32px;font-weight:400;line-height:1.5}
dialog p{font-size:14px;color:var(--muted);line-height:2}
dialog .round{font-size:22px}

/* 사진을 참고한 인사 캐릭터: 화면 오른쪽 하단 고정 */
#yeobaekDock{
  position:fixed;
  top:auto;
  left:auto;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(16px,env(safe-area-inset-bottom));
  z-index:15;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  width:146px;
  margin:0;
  padding:0;
  text-align:center;
  pointer-events:none;
}
.mascot-button{
  display:block;
  width:126px;
  height:162px;
  padding:0;
  border:0;
  background:none;
  pointer-events:auto;
  filter:drop-shadow(0 14px 17px #111a3440);
}
.mascot-button svg{width:100%;height:100%;overflow:visible}
.mascot-body{transform-origin:110px 218px}
.mascot-arm{
  transform-box:view-box;
  transform-origin:151px 158px;
}
.mascot-button.is-waving .mascot-arm{
  animation:mascot-wave 1.65s ease-in-out;
}
.mascot-button.is-waving .mascot-body{
  animation:mascot-nod 1.65s ease-in-out;
}
.mascot-button:hover .mascot-eyes{transform:translateY(-1px)}
.mascot-name{
  color:var(--gold);
  font-size:10px;
  letter-spacing:.12em;
  text-shadow:0 1px 5px #0008;
}
.mascot-message{
  display:block;
  max-width:146px;
  margin:0;
  padding:7px 10px;
  border:1px solid #ead1ac33;
  border-radius:12px;
  background:#202c43ed;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
}
.mascot-season{display:none}
.mascot-button[data-season=spring] .season-spring,
.mascot-button[data-season=summer] .season-summer,
.mascot-button[data-season=autumn] .season-autumn,
.mascot-button[data-season=winter] .season-winter{
  display:inline;
}
body.is-intro #yeobaekDock{
  visibility:hidden;
  pointer-events:none;
}
body.is-intro #yeobaekDock .mascot-button{
  pointer-events:none;
}
body.ready #yeobaekDock{
  animation:paper-hello .8s .35s both;
}
@keyframes mascot-wave{
  0%,100%{transform:rotate(0)}
  18%,50%{transform:rotate(-9deg)}
  34%,68%{transform:rotate(9deg)}
  84%{transform:rotate(-3deg)}
}
@keyframes mascot-nod{
  0%,100%{transform:rotate(0)}
  34%{transform:rotate(-1.5deg)}
  68%{transform:rotate(1deg)}
}
@keyframes paper-hello{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

@media(max-width:700px){
  header{padding:20px 5% 28px}
  .brand{font-size:14px}
  .brand small{font-size:7px}
  .nav-link{display:none}
  nav{gap:5px}
  .round{width:30px;height:30px}
  select{max-width:82px;padding:8px;font-size:9px}
  main{padding:0 7%}
  .hero h1{font-size:clamp(33px,8vw,50px)}
  .hero p:not(.eyebrow){font-size:12px}
  .hero-beam{left:12px}
  .hero>div{padding-left:26px}
  .track{left:12px}
  .folder-row{padding:45px 0 45px 38px}
  .row-trigger{grid-template-columns:1fr;gap:25px}
  .node{left:-26px;top:150px}
  .folder-row:nth-of-type(even) .folder-control,
  .folder-row:nth-of-type(even) .row-copy{
    grid-column:1;
    grid-row:auto;
  }
  .folder-control{max-width:360px;height:230px}
  .folder-cover{padding:20px}
  .folder-cover strong{font-size:25px}
  .row-copy{padding-left:3px}
  .row-copy h2{font-size:25px}
  .row-copy>p:not(.eyebrow){font-size:12px}
  .row-hint{margin-top:17px}
  .enhanced .folder-control{
    transform:translateX(-20px) rotate(-1deg);
  }
  .enhanced .folder-row:nth-of-type(even) .folder-control{
    transform:translateX(20px) rotate(1deg);
  }
  .panel{margin-left:-38px;margin-top:28px;padding:25px 20px}
  .panel-top h2{font-size:23px}
  .content{padding-top:35px}
  .info-grid,.process-grid{grid-template-columns:1fr;gap:20px}
  .reading p{font-size:13px}
  .demo{padding:22px 6%;min-height:420px}
  .demo-head strong{font-size:20px}
  .demo-head small{font-size:9px}
  .demo h4{font-size:30px}
  .produce{
    right:-55px;
    top:150px;
    width:150px;
    height:150px;
    opacity:.35;
    font-size:65px;
  }
  .ingredient-grid{gap:6px}
  .ingredient-grid>div{padding:13px 7px;font-size:10px}
  .ingredient-grid small{font-size:9px}
  .recipe-grid,.plan-grid{gap:8px}
  .recipe-grid article,.plan-grid article{padding:14px 10px}
  .tabs{gap:18px}
  .tabs button{font-size:11px}
  .cue-orb{width:220px;height:220px;right:-100px;top:130px}
  .screen-bar span:last-child{display:none}
  .opening-top{top:25px}
  .opening-top strong{font-size:12px}
  .opening-top small{font-size:8px;max-width:150px;line-height:1.8}
  .opening-actions{gap:5px}
  .opening-actions button{font-size:9px;padding:9px}
  #introCaption{bottom:28%}
  .archive-footer{font-size:8px}

  #yeobaekDock{
    width:96px;
    right:max(10px,env(safe-area-inset-right));
    bottom:max(10px,env(safe-area-inset-bottom));
  }
  #yeobaekDock .mascot-button{width:84px;height:108px}
  #yeobaekDock .mascot-name{font-size:8px}
  #yeobaekDock .mascot-message{display:none}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
  .enhanced .folder-control,
  .enhanced .folder-row:nth-of-type(even) .folder-control,
  .enhanced .row-copy{
    opacity:1;
    transform:none;
  }
  .node-ring,.node-spark,.node::after{display:none!important}
  .track-head::before{opacity:.4}
}

#pageBackdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08102110,transparent 55%,#08102020)}
#ambient{z-index:0;opacity:.9}
header{padding:25px 5.2% 28px;background:linear-gradient(#091224ed,#0b1426b5 68%,transparent);gap:28px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:43px;letter-spacing:-.035em;line-height:1;color:#f6ecdd}
.brand .brand-star{font-size:22px;vertical-align:top;margin-left:7px;color:var(--gold)}
.brand small{font-family:Georgia,serif;color:#ded2bc;font-size:8px;letter-spacing:.45em;margin-top:9px}
.chapter-title{display:flex;align-items:center;gap:20px;color:var(--gold);font:10px Georgia,serif;letter-spacing:.35em;white-space:nowrap}
.chapter-title::before,.chapter-title::after{content:"✦";font-size:15px;letter-spacing:0}
nav{gap:12px}.nav-link{font-family:Georgia,serif;font-size:10px;letter-spacing:.2em;color:#f1e7d6;padding:10px 7px}
.nav-link:hover{color:var(--gold)}
.round{width:35px;height:35px;border-color:#c9a87975;background:#0c172454;color:#f4d095;font-size:17px;transition:background .2s,border-color .2s}
.round:hover{background:#e7c58e17;border-color:var(--gold)}
.round[aria-pressed=false]{opacity:.6}
select{background:#10192dc9;border-color:#c9a87945;color:#d8c6a9;max-width:98px;font-size:9px;padding:9px}
main{max-width:1510px;padding:0 6.4%}
.hero{min-height:55svh;padding:145px 0 35px;align-items:center}
.hero .eyebrow{font-family:Georgia,serif;letter-spacing:.19em;font-size:9px;color:#cfb78f}
.hero h1{font-size:clamp(45px,5.2vw,80px);font-weight:300;line-height:1.24;letter-spacing:-.07em;margin:20px 0 20px;text-shadow:0 2px 30px #07102170}
.hero p:not(.eyebrow){font-size:clamp(13px,1.25vw,17px);line-height:1.95;color:#cbc5d0;letter-spacing:-.03em}
.hero .text-button{margin-top:22px;border-bottom-color:#e7c58ead;font-size:13px;padding-bottom:12px;min-width:160px}
.hero-beam{height:120px;background:linear-gradient(transparent,#e7c58e66);opacity:.7}
.eyebrow{color:#e1bf88}
.timeline{padding-bottom:100px}
.folder-row{padding:48px 0}
.row-trigger{min-height:330px;gap:14%}
.track{background:#e7c58e35}
.track>span{background:linear-gradient(#c9a26c30,#d7ae72 72%,#fff4d0)}
.track-head{width:17px;height:25px;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);background:#ffdf9e;box-shadow:none;filter:drop-shadow(0 0 9px #ffe2a5)}
.track-head::before,.track-head::after{display:none}
.node{width:6px;height:6px;background:#9b8667}
.node::before{inset:-6px;border-color:#e1bf8820}
.node.is-reached{background:#ffe5b2;box-shadow:0 0 12px #ffe4a999,0 0 30px #edb76d55}
.folder-control{max-width:480px;height:322px}
.folder-tab{top:10px;width:48%;height:66px;padding:18px 24px;background:linear-gradient(130deg,#42485f,#202c44);border:1px solid #ddd1b375;border-radius:17px 25px 0 0;color:#ded0b9;font:10px Georgia,serif;letter-spacing:.12em;box-shadow:0 0 20px #0002}

/* 세로는 뷰포트에 고정하고, 밤하늘만 오른쪽으로 이어서 흐릅니다. */
#pageBackdrop{
  inset:0;width:100%;height:100%;overflow:hidden;contain:layout paint;
  --sky-tile-width:max(100vw,150vh);
}
.sky-panorama{
  position:absolute;top:0;left:calc(-2 * var(--sky-tile-width));
  width:calc(4 * var(--sky-tile-width));height:100%;display:flex;
  pointer-events:none;will-change:transform;
  animation:sky-pan-right 360s linear infinite;
}
.sky-panorama>span{
  flex:0 0 var(--sky-tile-width);height:100%;
  background-image:var(--sky-panorama-image);
  background-size:cover;background-position:center;
}
/* 구름이 좌우 대칭 얼굴처럼 합쳐지지 않도록 원래 방향으로 이어 붙입니다. */
.sky-panorama>span{mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
@keyframes sky-pan-right{
  from{transform:translateX(0)}
  to{transform:translateX(calc(2 * var(--sky-tile-width)))}
}
body.visual-paused .sky-panorama{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.sky-panorama{animation:none;will-change:auto}}

#pageBackdrop>#ambient{position:absolute;inset:0;width:100%;height:100%;opacity:1;z-index:1}
#pageBackdrop::after{z-index:2}
#shootingCursor{position:fixed;left:0;top:0;width:0;height:0;z-index:100;pointer-events:none;--cursor-angle:-.4rad;--tail-length:24px}
.cursor-star{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:10px;line-height:1;color:#fff2c7;text-shadow:0 0 5px #e9bd76,0 0 10px #d9ad6770;transition:font-size .15s}
.cursor-tail{position:absolute;right:1px;top:-.7px;width:var(--tail-length);height:1.4px;transform:rotate(var(--cursor-angle));transform-origin:right center;background:linear-gradient(90deg,transparent,#dbb47188,#fff1c6);border-radius:100%;opacity:.85;transition:width .15s,opacity .15s}
#shootingCursor.is-idle .cursor-tail{width:12px;opacity:.3}
#shootingCursor.is-link .cursor-star{font-size:12px}
#shootingCursor.is-pressed .cursor-star{font-size:8px}
@media(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){body.shooting-cursor-active,body.shooting-cursor-active button,body.shooting-cursor-active a,body.shooting-cursor-active [role=tab]{cursor:none}}
@media(prefers-reduced-motion:reduce){#shootingCursor{display:none!important}}

/* 별 커서의 조작 피드백과 스크롤 깊이 */
#shootingCursor .cursor-star{font-size:14px;transition:font-size .18s,color .18s,text-shadow .18s,rotate .25s}
#shootingCursor.is-link .cursor-star{font-size:18px;color:#fffced;text-shadow:0 0 8px #ffe4a9,0 0 18px #f5c56e88;rotate:18deg}
#shootingCursor.is-link .cursor-tail{height:2px;opacity:1}
#shootingCursor.is-pressed .cursor-star{font-size:12px;rotate:45deg}
.cursor-ripple{position:absolute;left:0;top:0;width:12px;height:12px;border:1px solid #ffeac1;border-radius:50%;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
#shootingCursor.is-clicked .cursor-ripple{animation:cursor-ripple .5s ease-out both}
@keyframes cursor-ripple{0%{opacity:.85;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.5)}}

#pageBackdrop::after{background:radial-gradient(ellipse at var(--scroll-glow-x,60%) 70%,#d5ad7030,transparent 56%),linear-gradient(180deg,#08102110,transparent 55%,#08102020);opacity:calc(.45 + var(--scroll-glow,0)*.55);transition:opacity .7s}
.sky-leaves{translate:none}

let ready=false;
let active=-1;
let operation=0;
let panelAnimation=null;
let returnFocus=null;
let revealObserver=null;

function observeFolders(){
  revealObserver?.disconnect();

  if(!('IntersectionObserver' in window)||reduced()){
    triggers.forEach(trigger=>trigger.classList.add('visible'));
    return;
  }

  document.body.classList.add('enhanced');

  revealObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        revealObserver.unobserve(entry.target);
      }
    });
  },{
    threshold:.18,
    rootMargin:'0px 0px -7% 0px'
  });

  triggers.forEach(trigger=>revealObserver.observe(trigger));
}

function cancelFolderMotion(){
  operation++;
  panelAnimation?.cancel();
  panelAnimation=null;

  buttons.forEach(button=>{
    button.classList.remove('is-opening','is-open');
    button.removeAttribute('aria-busy');
  });

  panels.forEach(panel=>{
    panel.inert=false;
    panel.removeAttribute('aria-busy');
    panel.style.overflow='';
  });
}

async function openFolder(index){
  if(!ready||detail.open)return;

  if(index===active){
    await closeFolder();
    return;
  }

  cancelFolderMotion();

  const token=operation;
  active=index;
  document.body.classList.add('has-open-folder');

  panels.forEach(panel=>panel.hidden=true);
  buttons.forEach((button,i)=>{
    button.setAttribute('aria-expanded',String(i===index));
  });

  const button=buttons[index];
  const panel=panels[index];

  greetMascot(folders[index][0]+' 기록을 펼쳤어요.');

  triggers[index].classList.add('visible');
  button.classList.add('is-opening');
  button.setAttribute('aria-busy','true');

  if(!reduced())await wait(260);
  if(token!==operation)return;

  panel.hidden=false;
  panel.inert=true;

  const height=panel.getBoundingClientRect().height;

  if(!reduced()&&panel.animate){
    panel.style.overflow='hidden';
    const style=getComputedStyle(panel);

    panelAnimation=panel.animate([
      {
        height:'0px',
        opacity:0,
        paddingTop:'0px',
        paddingBottom:'0px',
        transform:'translateY(-10px)'
      },
      {
        height:height+'px',
        opacity:1,
        paddingTop:style.paddingTop,
        paddingBottom:style.paddingBottom,
        transform:'translateY(0)'
      }
    ],{
      duration:480,
      easing:'cubic-bezier(.22,.7,.2,1)'
    });

    try{await panelAnimation.finished}catch{}
  }

  if(token!==operation)return;

  panel.inert=false;
  panel.style.overflow='';
  button.removeAttribute('aria-busy');
  button.classList.remove('is-opening');
  button.classList.add('is-open');

  panel.querySelector('h2').focus({preventScroll:true});
  scrollToElement(panel);
  scheduleLine();
}

async function closeFolder(returnToRow=true){
  if(active<0)return;

  const index=active;
  const panel=panels[index];

  cancelFolderMotion();

  const token=operation;
  active=-1;
  document.body.classList.remove('has-open-folder');

  buttons[index].removeAttribute('aria-busy');
  buttons[index].setAttribute('aria-expanded','false');
  buttons[index].focus({preventScroll:true});
  panel.inert=true;

  if(!panel.hidden&&!reduced()&&panel.animate){
    panelAnimation=panel.animate([
      {opacity:1},
      {opacity:0}
    ],{
      duration:180,
      easing:'ease-out'
    });

    try{await panelAnimation.finished}catch{}
  }

  if(token!==operation)return;

  panel.hidden=true;
  panel.inert=false;
  scheduleLine();

  if(returnToRow){
    scrollToElement(buttons[index].closest('.folder-row'));
  }
}

let lineFrame=0;
const timelineHead=$('#timelineHead');
const timelineLight={lastY:scrollY};
const lightNodes=$$('.node').map(node=>{
  node.innerHTML='<i class="node-ring"></i><i class="node-ring secondary"></i>'+
    Array.from({length:12},(_,i)=>
      `<i class="node-spark" style="--angle:${i*30+8}deg;--radius:${46+i%3*9}px;--delay:${i%3*.035}s"></i>`
    ).join('');
  return {node,distance:null,armed:true,timer:0};
});

function clearArrivals(){
  lightNodes.forEach(state=>{
    clearTimeout(state.timer);
    state.node.classList.remove('is-arriving');
    state.node.closest('.folder-row').classList.remove('has-arrival');
  });
}

function lightArrival(state){
  clearTimeout(state.timer);
  state.node.classList.remove('is-arriving');
  void state.node.offsetWidth;
  state.node.classList.add('is-arriving');
  state.node.closest('.folder-row').classList.add('has-arrival');
  state.timer=setTimeout(()=>{
    state.node.classList.remove('is-arriving');
    state.node.closest('.folder-row').classList.remove('has-arrival');
  },1500);
}

function scheduleLine(){
  if(lineFrame)return;

  lineFrame=requestAnimationFrame(()=>{
    lineFrame=0;

    const rect=timeline.getBoundingClientRect();
    const guideY=innerHeight*.6;
    const progress=rect.height>0?clamp((guideY-rect.top)/rect.height):0;
    const movedDown=scrollY>timelineLight.lastY;

    $('#timelineFill').style.transform=`scaleY(${progress})`;
    timelineHead.style.top=`${progress*rect.height}px`;
    timelineHead.hidden=!ready||introRunning;

    lightNodes.forEach(state=>{
      const bounds=state.node.getBoundingClientRect();
      const distance=bounds.top+bounds.height/2-guideY;
      state.node.classList.toggle('is-reached',distance<=0);

      // 작은 스크롤 흔들림이나 패널 크기 변경만으로 효과를 반복하지 않습니다.
      if(distance>56)state.armed=true;
      if(state.distance!==null&&state.distance>0&&distance<=0&&movedDown){
        if(state.armed&&ready&&!introRunning&&visual&&!reduced())lightArrival(state);
        state.armed=false;
      }
      state.distance=distance;
    });
    timelineLight.lastY=scrollY;
  });
}

/* 음악 */
const audio=$('#bgm');
audio.preload='auto';
if(audio.getAttribute('src')!==CONFIG.audio)audio.src=CONFIG.audio;
audio.volume=.35;

let audioContext=null;
let analyser=null;
let audioSource=null;
let frequency=null;
const music={
  wanted:true,
  pending:false,
  blocked:false,
  failed:false,
  token:0
};

function updateMusic(){
  const graphWaiting=!!(
    audioSource&&audioContext?.state!=='running'
  );

  const playing=
    !audio.paused&&
    !audio.ended&&
    !music.failed&&
    !graphWaiting;

  const buffering=music.pending&&audio.readyState<3&&!music.blocked;
  const label=music.failed
    ?'음악 다시 시도'
    :buffering
      ?'음악 준비 중…'
    :playing
      ?'음악 끄기'
      :music.blocked||graphWaiting
        ?'음악 시작'
        :'음악 켜기';

  $('#musicButton').setAttribute('aria-pressed',String(playing));
  $('#musicButton').setAttribute('aria-label',label);
  $('#musicButton').title=music.failed
    ?'배경음악을 다시 재생하기'
    :label;

  $('#openingMusic').setAttribute('aria-pressed',String(playing));
  $('#openingMusic').textContent=music.failed
    ?'음악 다시 시도 ♪'
    :label+' ♪';
}

function connectAudioGraph(){
  if(
    !audioContext||
    audioContext.state!=='running'||
    audioSource
  )return;

  try{
    const next=audioContext.createAnalyser();

    next.fftSize=2048;
    next.smoothingTimeConstant=.48;
    next.minDecibels=-90;
    next.maxDecibels=-15;

    audioSource=audioContext.createMediaElementSource(audio);
    audioSource.connect(next);
    next.connect(audioContext.destination);

    analyser=next;
    frequency=new Uint8Array(next.frequencyBinCount);
  }catch{
    if(audioSource){
      try{
        audioSource.disconnect();
        audioSource.connect(audioContext.destination);
      }catch{}
    }

    analyser=null;
    frequency=null;
  }

  wake();
}

function ensureAudioGraph(){
  const AudioAPI=window.AudioContext||window.webkitAudioContext;
  if(!AudioAPI)return;

  try{
    if(!audioContext){
      audioContext=new AudioAPI({latencyHint:'interactive'});

      audioContext.addEventListener('statechange',()=>{
        connectAudioGraph();
        updateMusic();
        wake();
      });
    }

    if(audioContext.state==='running'){
      connectAudioGraph();
    }else if(audioContext.state==='suspended'){
      audioContext.resume()
        .then(connectAudioGraph)
        .catch(()=>{});
    }
  }catch{}
}

async function startMusic(fromGesture=false){
  if(!music.wanted)return;
  if(music.pending&&!fromGesture)return;

  if(!audio.paused&&!audio.ended){
    ensureAudioGraph();
    updateMusic();
    wake();
    return;
  }

  const token=++music.token;

  music.pending=true;
  music.failed=false;
  updateMusic();
  audio.muted=false;
  audio.volume=.35;

  try{
    const playback=audio.play();

    if(fromGesture)ensureAudioGraph();

    await playback;

    if(token!==music.token){
      if(!music.wanted)audio.pause();
      return;
    }

    music.blocked=false;
    ensureAudioGraph();
    updateMusic();
    wake();
  }catch(error){
    if(token!==music.token)return;

    music.blocked=error.name==='NotAllowedError';
    music.failed=!music.blocked&&error.name!=='AbortError';

    updateMusic();
  }finally{
    if(token===music.token){music.pending=false;updateMusic();}
  }
}

function stopMusic(){
  music.wanted=false;
  music.pending=false;
  music.blocked=false;
  music.token++;

  audio.pause();
  updateMusic();
  wake();
}

function toggleMusic(){
  if(music.failed){
    audio.load();
    music.failed=false;
    music.wanted=true;
    startMusic(true);
    return;
  }
  if(
    music.wanted&&
    !audio.paused&&
    audioSource&&
    audioContext?.state!=='running'
  ){
    startMusic(true);
    return;
  }

  if(music.wanted&&(!audio.paused||music.pending)){
    stopMusic();
  }else{
    music.wanted=true;
    startMusic(true);
  }
}

function unlockMusic(event){
  if(!event.isTrusted||!music.wanted||music.failed)return;
  if(event.target?.closest?.('#musicButton,#openingMusic'))return;

  if(
    event.type==='keydown'&&
    event.key!=='Enter'&&
    event.key!==' '
  )return;

  if(audio.paused||music.blocked){
    startMusic(true);
  }else if(!analyser||audioContext?.state!=='running'){
    ensureAudioGraph();
  }
}

document.addEventListener('pointerdown',unlockMusic,{

  passive:true
});
document.addEventListener('click',unlockMusic,{capture:true});
document.addEventListener('keydown',unlockMusic,{capture:true});

/* 계절 인트로 */
const seasons={
  spring:{name:'봄',colors:['#f0b4c8','#ecc8d0','#f6d6df']},
  summer:{name:'여름',colors:['#89ba79','#b3d794','#69a589']},
  autumn:{name:'가을',colors:['#edb76d','#d98c51','#da785c']},
  winter:{name:'겨울',colors:['#f1f5ef','#d0e3ed','#c5d5dc']}
};

function autoSeason(){
  const month=Number(new Intl.DateTimeFormat('en',{
    timeZone:'Asia/Seoul',
    month:'numeric'
  }).format(new Date()));

  return month>=3&&month<=5
    ?'spring'
    :month>=6&&month<=8
      ?'summer'
      :month>=9&&month<=11
        ?'autumn'
        :'winter';
}

let seasonKey=autoSeason();
let particles=[];
let drifting=[];
let W=0;
let H=0;
let DPR=1;

const INTRO={release:4.2,turn:6.15};

const introCanvas=$('#introCanvas');
const ic=introCanvas.getContext('2d');
const ambient=$('#ambient');
const ac=ambient.getContext('2d');
const sceneCanvas=$('#musicScene');
const sceneContext=sceneCanvas.getContext('2d');

let introRunning=false;
let introStart=0;
let introFocus=null;
let pageTurning=false;
let pageAnimation=null;
let introVersion=0;
let greetingSize=0;

const greetingLines=['방문해 주셔서','감사합니다.'];

function greetingFont(){
  return `650 ${greetingSize}px Arial,"Malgun Gothic",sans-serif`;
}

function configureGreeting(context){
  context.font=greetingFont();
  context.textAlign='center';
  context.textBaseline='middle';
}

function paintGreeting(context,alpha=1){
  context.save();
  configureGreeting(context);
  context.globalAlpha=alpha;
  context.fillStyle='#fff5e9';

  greetingLines.forEach((line,index)=>{
    context.fillText(
      line,
      W/2,
      H*.43+(index-.5)*greetingSize*1.44
    );
  });

  context.restore();
}

function buildParticles(){
  const sample=document.createElement('canvas');
  sample.width=W;
  sample.height=H;

  const context=sample.getContext('2d');

  greetingSize=Math.min(W*.112,H*.105,96);
  configureGreeting(context);

  while(
    Math.max(...greetingLines.map(line=>context.measureText(line).width))>W*.84&&
    greetingSize>16
  ){
    greetingSize--;
    configureGreeting(context);
  }

  paintGreeting(context);

  const data=context.getImageData(0,0,W,H).data;
  const step=W<700?4:5;

  particles=[];

  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      if(data[(y*W+x)*4+3]<110)continue;

      particles.push({
        x,y,
        sx:-W*.1+Math.random()*W*.8,
        sy:H*.25+Math.random()*H*.55,
        r:.9+Math.random()*1.2,
        delay:Math.random()*.18,
        depth:.45+Math.random()*.55,
        seed:Math.random()*Math.PI*2,
        color:seasons[seasonKey].colors[Math.floor(Math.random()*3)]
      });
    }
  }

  drifting=Array.from({length:W<700?28:46},()=>({
    x:Math.random()*W,
    y:Math.random()*H,
    r:2+Math.random()*4,
    depth:.4+Math.random()*.6,
    seed:Math.random()*Math.PI*2,
    color:seasons[seasonKey].colors[Math.floor(Math.random()*3)]
  }));
}

function resize(){
  const nextWidth=Math.round(innerWidth);
  const nextHeight=Math.round(innerHeight);
  const changed=nextWidth!==W||nextHeight!==H;

  W=nextWidth;
  H=nextHeight;
  DPR=Math.min(devicePixelRatio||1,1.7);

  [introCanvas,ambient,sceneCanvas].forEach(canvas=>{
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  });

  if(changed)buildParticles();

  scheduleLine();
  wake();
}

function drawShape(context,x,y,r,angle,color){
  context.save();
  context.translate(x,y);
  context.rotate(angle);
  context.fillStyle=color;
  context.strokeStyle=color;
  context.lineWidth=.7;

  if(seasonKey==='winter'){
    context.beginPath();

    for(let k=0;k<3;k++){
      const a=k*Math.PI/3;
      context.moveTo(-r*Math.cos(a),-r*Math.sin(a));
      context.lineTo(r*Math.cos(a),r*Math.sin(a));
    }

    context.stroke();
  }else if(seasonKey==='spring'){
    context.beginPath();
    context.moveTo(0,-r);
    context.bezierCurveTo(r*1.6,-r*.5,r,r*1.5,0,r);
    context.bezierCurveTo(-r,r*1.5,-r*1.6,-r*.5,0,-r);
    context.fill();
  }else if(seasonKey==='summer'){
    context.beginPath();
    context.moveTo(-r*1.4,0);
    context.quadraticCurveTo(0,-r*1.6,r*1.4,0);
    context.quadraticCurveTo(0,r*1.6,-r*1.4,0);
    context.fill();
  }else{
    context.beginPath();

    for(let k=0;k<10;k++){
      const a=k*Math.PI/5-Math.PI/2;
      const radius=k%2?r*.48:r*1.5;
      context.lineTo(Math.cos(a)*radius,Math.sin(a)*radius);
    }

    context.closePath();
    context.fill();
  }

  context.restore();
}

function completeIntro(){
  if(!introRunning)return;

  introRunning=false;
  pageTurning=false;
  ready=true;

  opening.hidden=true;
  opening.inert=true;

  pageAnimation?.cancel();
  pageAnimation=null;

  opening.classList.remove('is-turning');
  main.inert=false;
  document.querySelector('header').inert=false;

  document.body.classList.remove('is-intro');
  document.body.classList.add('ready','is-paper-entry');

  observeFolders();
  scheduleLine();
  syncMascot();
  greetMascot();

  const target=
    introFocus&&
    introFocus!==document.body&&
    !opening.contains(introFocus)
      ?introFocus
      :$('#explore');

  target.focus({preventScroll:true});
}

async function turnIntroPage(){
  if(!introRunning||pageTurning)return;

  if(reduced()||!opening.animate){
    completeIntro();
    return;
  }

  pageTurning=true;

  const version=introVersion;

  opening.inert=true;
  opening.classList.add('is-turning');
  document.body.classList.add('ready','is-paper-entry');

  if('IntersectionObserver' in window){
    document.body.classList.add('enhanced');
  }

  pageAnimation=opening.animate([
    {
      transform:'perspective(1800px) translateX(0) rotateY(0deg) rotateZ(0deg)',
      opacity:1,
      offset:0
    },
    {
      transform:'perspective(1800px) translateX(-3%) rotateY(-48deg) rotateZ(-1deg)',
      opacity:1,
      offset:.58
    },
    {
      transform:'perspective(1800px) translateX(-12%) rotateY(-86deg) rotateZ(-2deg)',
      opacity:0,
      offset:1
    }
  ],{
    duration:1150,
    easing:'cubic-bezier(.4,0,.2,1)',
    fill:'forwards'
  });

  try{await pageAnimation.finished}catch{}

  if(version!==introVersion||!introRunning)return;

  completeIntro();
}

function seasonalPose(particle,elapsed){
  const u=Math.max(0,elapsed-particle.delay);
  const depth=particle.depth;
  const sway=
    Math.sin(u*2.4+particle.seed)-
    Math.sin(particle.seed);

  let dx,dy,angle;

  if(seasonKey==='spring'){
    dx=W*.38*u*depth+sway*24*u;
    dy=H*.16*u*depth-Math.sin(u*2.1)*30*depth;
    angle=particle.seed+u*(1.1+depth);
  }else if(seasonKey==='summer'){
    dx=W*.43*u*depth;
    dy=H*.10*u*depth+sway*30*u;
    angle=particle.seed+Math.sin(u*1.5)*.35;
  }else if(seasonKey==='autumn'){
    dx=W*.38*u*depth+sway*18*u;
    dy=H*.23*u*depth;
    angle=particle.seed+u*(2.4+depth);
  }else{
    dx=W*.09*u*depth+sway*16*u;
    dy=H*.25*u*depth;
    angle=particle.seed+u*.2;
  }

  return{
    x:particle.x+dx,
    y:particle.y+dy,
    angle,u
  };
}

function drawDrifting(t){
  const fade=ease(t/.8)*(1-ease((t-INTRO.release)/1.9));
  if(fade<=0)return;

  const winter=seasonKey==='winter';

  drifting.forEach(particle=>{
    const travel=t*(winter?24:42)*particle.depth;

    const x=(
      particle.x+
      travel*.65+
      Math.sin(t*.7+particle.seed)*25+
      W+40
    )%(W+80)-40;

    const y=(particle.y+travel+H+40)%(H+80)-40;

    const nearText=
      Math.abs(x-W/2)<W*.36&&
      Math.abs(y-H*.43)<greetingSize*1.8;

    ic.globalAlpha=fade*(nearText?.07:.26)*particle.depth;

    drawShape(
      ic,x,y,particle.r,
      particle.seed+t*(winter?.12:.45),
      particle.color
    );
  });

  ic.globalAlpha=1;
}

function drawIntro(now){
  const t=(now-introStart)/1000;
  ic.clearRect(0,0,W,H);

  if(pageTurning){
    $('#introCaption').style.opacity=0;
    return;
  }

  if(reduced()){
    paintGreeting(ic,1);
    $('#introCaption').style.opacity=1;

    if(t>2.8)completeIntro();
    return;
  }

  drawDrifting(t);

  const gather=ease((t-1)/1.5);
  const solid=ease((t-2.05)/.6);
  const release=t-INTRO.release;
  const dissolve=ease(release/.4);
  const lightAlpha=ease(t/.5)*(1-ease((t-1.15)/1.1));

  if(lightAlpha>0){
    const x1=W*.12;
    const x2=lerp(x1,W*.86,ease(t/1.4));
    const y=H*.43;

    ic.save();
    ic.globalAlpha=lightAlpha;
    ic.strokeStyle='#f4d8b5';
    ic.lineWidth=1;
    ic.shadowColor='#f4d8b5';
    ic.shadowBlur=16;
    ic.beginPath();
    ic.moveTo(x1,y);
    ic.lineTo(x2,y);
    ic.stroke();
    ic.restore();
  }

  const speed=seasonKey==='winter'
    ?.45
    :seasonKey==='summer'
      ?.75
      :1;

  particles.forEach(particle=>{
    if(release>0){
      const pose=seasonalPose(particle,release);

      ic.globalAlpha=
        lerp(.02,1,dissolve)*
        (1-ease((pose.u-.7)/1.05));

      const size=particle.r*(
        1+ease(pose.u/.6)*1.5*particle.depth
      );

      drawShape(
        ic,pose.x,pose.y,size,
        pose.angle*ease(pose.u/.45),
        particle.color
      );
    }else{
      ic.globalAlpha=ease((t-.7)/.6)*(1-solid*.98);

      const float=
        (1-gather)*Math.sin(t*speed+particle.seed)*12;

      drawShape(
        ic,
        lerp(particle.sx,particle.x,gather),
        lerp(particle.sy,particle.y,gather)+float,
        particle.r,
        (1-gather)*(particle.seed+t*speed),
        particle.color
      );
    }
  });

  ic.globalAlpha=1;

  if(solid>0){
    paintGreeting(ic,solid*(1-dissolve));
  }

  $('#introCaption').style.opacity=
    ease((t-2.65)/.6)*
    (1-ease((release-.2)/.8));

  if(t>=INTRO.turn)turnIntroPage();
}

function startIntro(){
  introVersion++;
  clearArrivals();
  lightNodes.forEach(state=>{
    state.distance=null;
    state.armed=true;
  });

  pageAnimation?.cancel();
  pageAnimation=null;
  pageTurning=false;

  opening.inert=false;
  introFocus=document.activeElement;

  detail.close();
  cancelFolderMotion();
  active=-1;
  document.body.classList.remove('has-open-folder');

  panels.forEach(panel=>panel.hidden=true);
  buttons.forEach(button=>{
    button.setAttribute('aria-expanded','false');
    button.removeAttribute('aria-busy');
  });

  ready=false;
  main.inert=true;
  document.querySelector('header').inert=true;

  document.body.classList.remove('ready','is-paper-entry');
  document.body.classList.add('is-intro');

  opening.classList.remove('is-turning');
  revealObserver?.disconnect();
  triggers.forEach(trigger=>trigger.classList.remove('visible'));

  scrollTo({top:0,behavior:'instant'});
  opening.hidden=false;
  $('#introCaption').style.opacity=0;

  seasonKey=$('#seasonSelect').value==='auto'
    ?autoSeason()
    :$('#seasonSelect').value;

  $('#seasonLabel').textContent=
    `${seasonKey.toUpperCase()} IN MOTION · ${seasons[seasonKey].name}`;

  syncMascot();
  buildParticles();

  introRunning=true;
  introStart=performance.now();

  $('#skipIntro').focus({preventScroll:true});
  wake();
}

function skipIntro(){
  introVersion++;
  completeIntro();
}

// 배경 이미지의 별 위치를 유지하고, 작은 별들을 더합니다.
const skyStars=[[79.4,694.3],[1251.9,304.7],[1149.2,675.5],[1307.9,218.4],[93.3,428.1],[811.6,190.1],[1477.3,253.6],[1053.7,932.3],[1346.1,786.8],[1294,178],[212.6,244.5],[108,575.8],[1290.8,56.7],[956,161],[322,921.8],[671.4,795],[1060.8,376],[1435,480.5]];
const starField=Array.from({length:72},(_,i)=>({
  x:((i*.61803398875+.13)%1),
  y:.04+((i*.41421356237+.21)%1)*.84,
  size:.8+(i%5)*.22,
  phase:i*2.39996,
  band:i%3,
  accent:i%5===0
}));
const starlight={time:0,bands:[0,0,0],baseline:0,flash:0,lastBeat:-Infinity};
function drawSpectrum(now){
  ac.clearRect(0,0,W,H);
  spectrumEnergy=0;
  const playing=!audio.paused&&!audio.ended&&!audio.muted&&!music.failed;
  const animate=playing&&visual&&!reduced();
  const reactive=animate&&analyser&&frequency&&audioContext?.state==='running';
  const state=starlight;
  const dt=state.time?Math.min(.1,Math.max(0,(now-state.time)/1000)):1/30;
  state.time=now;
  const targets=[0,0,0],counts=[0,0,0];
  if(reactive){
    analyser.getByteFrequencyData(frequency);
    const binHz=audioContext.sampleRate/analyser.fftSize;
    let total=0;
    for(let i=0;i<frequency.length;i++){
      total+=frequency[i];
      const hz=i*binHz;
      if(hz<45||hz>10000)continue;
      const band=hz<220?0:hz<2000?1:2;
      targets[band]+=frequency[i]/255;counts[band]++;
    }
    spectrumEnergy=total/Math.max(1,frequency.length)/255;
    for(let i=0;i<3;i++)targets[i]=counts[i]?targets[i]/counts[i]:0;
    // 저음이 평소보다 커지는 순간에만 짧은 별빛을 더합니다.
    if(targets[0]>.07&&targets[0]>state.baseline+.04&&now-state.lastBeat>330){
      state.flash=Math.min(1,(targets[0]-state.baseline)*3.2);
      state.lastBeat=now;
    }
    state.baseline=lerp(state.baseline,targets[0],1-Math.exp(-dt/.65));
  }else{
    state.baseline=0;state.flash=0;state.lastBeat=-Infinity;
    state.bands.fill(0);
  }
  state.flash*=Math.exp(-dt/.34);
  state.bands.forEach((value,i)=>{
    state.bands[i]=lerp(value,targets[i],1-Math.exp(-dt/(targets[i]>value?.055:.28)));
  });
  const backdrop=$('#pageBackdrop');
  const bw=Math.max(1,backdrop.clientWidth),bh=Math.max(1,backdrop.clientHeight);
  const scale=Math.max(bw/1536,bh/1024);
  const stars=skyStars.map(([x,y],i)=>({
    x:(x*scale+(bw-1536*scale)/2)/bw*W,
    y:(y*scale+(bh-1024*scale)/2)/bh*H,
    size:1.45,phase:i*2.39996,band:i%3,accent:true
  }));
  const count=W<700?40:starField.length;
  for(let i=0;i<count;i++)stars.push({...starField[i],x:starField[i].x*W,y:starField[i].y*H});
  ac.save();
  ac.globalCompositeOperation='screen';
  stars.forEach(star=>{
    if(star.x<0||star.x>W||star.y<0||star.y>H)return;
    const wave=.5+.5*Math.sin(audio.currentTime*(.8+star.band*.22)+star.phase);
    const energy=Math.min(1,Math.pow(state.bands[star.band]*2.4,.8));
    // 소리가 없거나 재생이 멈추면 작은 정적인 별만 남깁니다.
    const pulse=reactive?Math.min(1,energy*(.08+.92*Math.pow(wave,3))+state.flash*(.2+.8*wave)):0;
    const radius=star.size*(1+pulse*1.6);
    ac.globalAlpha=Math.min(.95,(star.accent?.45:.28)+pulse*.85);
    ac.fillStyle=star.band===2?'#e2edff':'#fff0cb';
    ac.shadowColor=star.band===2?'#b5d3ff':'#ffd895';
    ac.shadowBlur=3+pulse*24;
    ac.beginPath();ac.arc(star.x,star.y,radius,0,Math.PI*2);ac.fill();
    if(star.accent||pulse>.3){
      const arm=(star.accent?4:2)+pulse*(star.accent?19:10);
      ac.globalAlpha=(star.accent?.25:.08)+pulse*.75;
      ac.beginPath();
      ac.moveTo(star.x,star.y-arm);
      ac.lineTo(star.x+.7,star.y-.7);
      ac.lineTo(star.x+arm,star.y);
      ac.lineTo(star.x+.7,star.y+.7);
      ac.lineTo(star.x,star.y+arm);
      ac.lineTo(star.x-.7,star.y+.7);
      ac.lineTo(star.x-arm,star.y);
      ac.lineTo(star.x-.7,star.y-.7);
      ac.closePath();ac.fill();
    }
  });
  ac.restore();
  drawAudioScene(animate);
}

/* 실제 파형의 음량과 타격 변화를 감지하는 수면 파동 */
const waterState={samples:null,previous:null,time:0,level:0,baseline:0,bass:0,beatInterval:.8,lastBeat:-Infinity,lastSpawn:-Infinity,waves:[],totalBeats:0};
function resetWater(){
 waterState.time=0;waterState.level=0;waterState.baseline=0;waterState.bass=0;
 waterState.lastBeat=-Infinity;waterState.lastSpawn=-Infinity;waterState.beatInterval=.8;
 waterState.waves.length=0;if(waterState.previous)waterState.previous.fill(0);
}
function drawAudioScene(animate){
 const ctx=sceneContext;
 ctx.clearRect(0,0,W,H);
 if(!animate||!analyser){resetWater();return;}
 const state=waterState,time=audio.currentTime;
 if(time<state.time||time-state.time>.5)resetWater();
 const dt=state.time?clamp(time-state.time,.001,.08):1/30;
 state.time=time;
 if(!state.samples||state.samples.length!==analyser.fftSize)state.samples=new Float32Array(analyser.fftSize);
 if(!state.previous||state.previous.length!==analyser.frequencyBinCount)state.previous=new Uint8Array(analyser.frequencyBinCount);
 analyser.getFloatTimeDomainData(state.samples);
 analyser.getByteFrequencyData(frequency);
 let power=0;for(const sample of state.samples)power+=sample*sample;
 const rms=Math.sqrt(power/state.samples.length);
 const target=Math.min(1,Math.pow(rms*5.5,.8));
 const previousLevel=state.level;
 state.level=lerp(state.level,target,1-Math.exp(-dt/(target>state.level?.045:.18)));
 const binHz=audioContext.sampleRate/analyser.fftSize;
 let bass=0,bins=0,flux=0;
 for(let i=0;i<frequency.length;i++){
  const hz=i*binHz;
  if(hz>=45&&hz<=220){bass+=frequency[i]/255;bins++;}
  if(hz>=45&&hz<=2500)flux+=Math.max(0,frequency[i]-state.previous[i])/255;
  state.previous[i]=frequency[i];
 }
 bass=bins?bass/bins:0;
 const fluxBins=Math.max(1,Math.floor(2455/binHz));
 flux/=fluxBins;
 state.bass=lerp(state.bass,bass,1-Math.exp(-dt/.09));
 const rise=state.level-state.baseline;
 const onset=state.level>.065&&state.level>state.baseline*1.22&&((rise>.035&&state.level-previousLevel>.004)||flux>.025)&&time-state.lastBeat>.2;
 const addWave=(accent)=>{
  const strength=clamp(state.level*(.8+.2*state.bass)*(accent?1:.65),.015,1);
  const rate=clamp(1/state.beatInterval,.5,5);
  const maxRadius=W*(.14+.59*strength);
  state.waves.push({born:time,rate,radius:W*.015,maxRadius,strength,speed:W*(.11+.18*strength+.022*rate)});
  if(state.waves.length>7)state.waves.shift();
  state.lastSpawn=time;
 };
 if(onset){
  if(Number.isFinite(state.lastBeat))state.beatInterval=lerp(state.beatInterval,clamp(time-state.lastBeat,.2,1.8),.55);
  state.lastBeat=time;state.totalBeats++;addWave(true);
 }else if(state.level>.045&&time-state.lastSpawn>1.7-state.level*.9&&time-state.lastBeat>1){
  // 길게 이어지는 음도 실제 음량이 있을 때만 잔잔한 물결을 만듭니다.
  addWave(false);
 }
 state.baseline=lerp(state.baseline,state.level,1-Math.exp(-dt/.65));
 const cy=H*.87;
 ctx.save();ctx.globalCompositeOperation='screen';
 ctx.save();ctx.translate(0,cy);ctx.scale(1,.22);
 const haze=ctx.createRadialGradient(W*.5,0,0,W*.5,0,W*.63);
 haze.addColorStop(0,`rgba(146,184,195,${state.level*.15})`);haze.addColorStop(1,'#92b8c300');
 ctx.fillStyle=haze;ctx.fillRect(0,-H*5,W,H*10);ctx.restore();
 const color=ctx.createLinearGradient(0,0,W,0);
 color.addColorStop(0,'#edc88b00');color.addColorStop(.25,'#b5ceda');color.addColorStop(.5,'#ffe8b3');color.addColorStop(.75,'#dcb77e');color.addColorStop(1,'#edc88b00');
 for(const wave of state.waves){
  // 타격 직후의 짧은 공격 구간에서 실제 최고 음량을 따라갑니다.
  if(time-wave.born<.18){
   wave.strength=Math.max(wave.strength,clamp(state.level*(.8+.2*state.bass)));
   wave.maxRadius=W*(.14+.59*wave.strength);
   wave.speed=W*(.11+.18*wave.strength+.022*wave.rate);
  }
  wave.radius=W*.015+(time-wave.born)*wave.speed*.92;
  const progress=clamp(wave.radius/wave.maxRadius);
  const opacity=Math.pow(Math.sin(progress*Math.PI),.8)*(.16+wave.strength*.73);
  const flatten=.055+wave.strength*.09;
  ctx.globalAlpha=opacity;ctx.strokeStyle=color;
  ctx.lineWidth=.7+wave.strength*1.6;ctx.shadowColor='#f0ce94';ctx.shadowBlur=4+wave.strength*17;
  ctx.beginPath();ctx.ellipse(W*.5,cy+progress*H*.03,wave.radius,wave.radius*flatten,0,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=opacity*.25;ctx.lineWidth=.6;
  ctx.beginPath();ctx.ellipse(W*.5,cy+progress*H*.03+4,wave.radius*.96,wave.radius*flatten,0,0,Math.PI*2);ctx.stroke();
 }
 state.waves=state.waves.filter(wave=>wave.radius<wave.maxRadius);
 ctx.restore();
}

/* 애니메이션 루프 */
function loop(now){
  frame=0;
  if(document.hidden)return;

  if(introRunning)drawIntro(now);

  if(now-lastDraw>33){
    drawSpectrum(now);
    lastDraw=now;
  }

  if(
    introRunning||
    (
      visual&&
      !reduced()&&
      (!audio.paused||spectrumEnergy>.002)
    )
  ){
    frame=requestAnimationFrame(loop);
  }
}

function wake(){
  if(!frame&&!document.hidden){
    lastDraw=0;
    frame=requestAnimationFrame(loop);
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    pausedAt=performance.now();
    cancelAnimationFrame(frame);
    frame=0;
  }else{
    if(introRunning&&pausedAt){
      introStart+=performance.now()-pausedAt;
    }

    pausedAt=0;
    wake();
  }
});

motion.addEventListener('change',()=>{
  clearArrivals();
  if(reduced())clearSpectrum();
  if(ready)observeFolders();
  scheduleLine();
  wake();
});

addEventListener('resize',resize,{passive:true});

/* 인사 캐릭터 */
const mascot=$('#yeobaek');
const mascotMessage=$('#mascotMessage');
let mascotTimer=0;

function greetMascot(message='함께 기록을 펼쳐볼까요?'){
  clearTimeout(mascotTimer);
  if(!mascot||!mascotMessage)return;

  mascot.classList.remove('is-waving');
  void mascot.getBoundingClientRect();
  mascot.classList.add('is-waving');

  mascotMessage.textContent=message;

  mascotTimer=setTimeout(()=>{
    mascot.classList.remove('is-waving');
  },1750);
}

mascot?.addEventListener('click',()=>greetMascot());

function syncMascot(){
  if(mascot)mascot.dataset.season=seasonKey;
}

/* 작은 별과 짧은 꼬리의 마우스 포인터 */
const shootingCursor=$('#shootingCursor');
const cursorMedia=matchMedia('(hover:hover) and (pointer:fine)');
let cursorPoint=null,cursorIdleTimer=0,cursorClickTimer=0;
function hideShootingCursor(){
 document.body.classList.remove('shooting-cursor-active');
 shootingCursor.hidden=true;cursorPoint=null;
 shootingCursor.classList.remove('is-pressed','is-clicked','is-link');
 clearTimeout(cursorClickTimer);
 clearTimeout(cursorIdleTimer);
}
function moveShootingCursor(event){
 if(event.pointerType!=='mouse'||!cursorMedia.matches||reduced()||detail.open||event.target.closest?.('input,textarea,select,[contenteditable=true],iframe')){hideShootingCursor();return;}
 const dx=cursorPoint?event.clientX-cursorPoint.x:1,dy=cursorPoint?event.clientY-cursorPoint.y:-.4;
 const distance=Math.hypot(dx,dy);
 if(distance>.3)shootingCursor.style.setProperty('--cursor-angle',`${Math.atan2(dy,dx)}rad`);
 shootingCursor.style.setProperty('--tail-length',`${Math.min(30,18+distance*.45)}px`);
 shootingCursor.style.transform=`translate3d(${event.clientX}px,${event.clientY}px,0)`;
 shootingCursor.classList.toggle('is-link',!!event.target.closest?.('button,a,[role=tab]'));
 shootingCursor.classList.remove('is-idle');
 shootingCursor.hidden=false;document.body.classList.add('shooting-cursor-active');
 cursorPoint={x:event.clientX,y:event.clientY};
 clearTimeout(cursorIdleTimer);cursorIdleTimer=setTimeout(()=>shootingCursor.classList.add('is-idle'),140);
}
document.addEventListener('pointermove',moveShootingCursor,{passive:true});
document.addEventListener('pointerdown',event=>{
 moveShootingCursor(event);
 if(shootingCursor.hidden)return;
 shootingCursor.classList.add('is-pressed');
 shootingCursor.classList.remove('is-clicked');
 void shootingCursor.offsetWidth;
 shootingCursor.classList.add('is-clicked');
 clearTimeout(cursorClickTimer);
 cursorClickTimer=setTimeout(()=>shootingCursor.classList.remove('is-clicked'),520);
},{passive:true});
document.addEventListener('pointerup',()=>shootingCursor.classList.remove('is-pressed'),{passive:true});
document.documentElement.addEventListener('pointerleave',hideShootingCursor);
addEventListener('blur',hideShootingCursor);document.addEventListener('keydown',hideShootingCursor);
cursorMedia.addEventListener('change',hideShootingCursor);motion.addEventListener('change',hideShootingCursor);
new MutationObserver(()=>{if(detail.open)hideShootingCursor();}).observe(detail,{attributes:true,attributeFilter:['open']});

/* 스크롤 진행에 따라 밤하늘과 전경의 깊이를 조금씩 바꿉니다. */
let depthFrame=0,depthTimer=0,depthLastY=scrollY;
function scheduleDepth(){
 if(depthFrame)return;
 depthFrame=requestAnimationFrame(()=>{
  depthFrame=0;
  const range=Math.max(1,document.documentElement.scrollHeight-innerHeight);
  const progress=clamp(scrollY/range);
  const root=document.documentElement;
  root.style.setProperty('--page-progress',progress);
  root.style.setProperty('--scroll-glow-x',`${35+progress*35}%`);
  const movement=Math.min(1,Math.abs(scrollY-depthLastY)/90);
  root.style.setProperty('--scroll-glow',reduced()?0:movement);
  depthLastY=scrollY;
  clearTimeout(depthTimer);
  depthTimer=setTimeout(()=>root.style.setProperty('--scroll-glow',0),200);
 });
}
addEventListener('scroll',scheduleDepth,{passive:true});
addEventListener('resize',scheduleDepth,{passive:true});
motion.addEventListener('change',scheduleDepth);
scheduleDepth();

/* 시작 */
syncMascot();
resize();
startIntro();
startMusic();
</script>
<!-- 아래 전체를 기존 HTML의 </body> 바로 앞에 한 번만 붙여넣으세요. -->
<style>
/* 제목: 인트로 뒤 한 번만 지나가는 금빛 */
#archiveTitle.dl-title-shine{
  background:linear-gradient(110deg,currentColor 30%,#ffe4ab 43%,#fffbee 50%,#ffe4ab 57%,currentColor 70%);
  background-size:300% 100%;background-position:100% 0;
  background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:dl-title-shine 2.8s .35s ease-in-out both;
}
@keyframes dl-title-shine{from{background-position:100% 0}to{background-position:0% 0}}
/* 기존 표지 질감 위에 독립된 반사광을 올립니다. */
.folder-cover{isolation:isolate}
.dl-folder-glare{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:radial-gradient(circle at var(--dl-x,50%) var(--dl-y,40%),#fff2ce30, #edce9310 27%,transparent 62%);
  opacity:0;transition:opacity .3s ease;
}
@media(hover:hover) and (pointer:fine){
 .folder-control.dl-hover .dl-folder-glare{opacity:1}
 .folder-control:focus-visible .dl-folder-glare{opacity:.65}
}
/* 유성: 텍스트 뒤, 배경 위에 한 개씩만 표시 */
.dl-meteor{
  position:fixed;left:var(--dl-left);top:var(--dl-top);z-index:0;
  width:clamp(65px,9vw,130px);height:1px;border-radius:50%;pointer-events:none;
  background:linear-gradient(90deg,transparent,#e3c89588,#fff1d4);
  box-shadow:0 0 5px #e9c99055;opacity:0;
  animation:dl-meteor 1.6s ease-out both;
}
.dl-meteor::after{content:"";position:absolute;right:-1px;top:-1px;width:3px;height:3px;border-radius:50%;background:#fff3d4;box-shadow:0 0 7px #ffdfa2}
@keyframes dl-meteor{
  0%{transform:translate(0,0) rotate(24deg);opacity:0}
  18%{opacity:.65}
  100%{transform:translate(min(28vw,340px),min(12vw,150px)) rotate(24deg);opacity:0}
}
body.visual-paused .dl-folder-glare,body.visual-paused .dl-meteor{display:none}
@media(prefers-reduced-motion:reduce){
 #archiveTitle.dl-title-shine{animation:none;background:none;-webkit-text-fill-color:currentColor}
 .dl-folder-glare,.dl-meteor{display:none!important}
}
</style>
<script>
(()=>{
  if(window.__dlPolish)return;
  window.__dlPolish=true;
  const title=document.getElementById('archiveTitle');
  const motion=matchMedia('(prefers-reduced-motion:reduce)');
  const mouse=matchMedia('(hover:hover) and (pointer:fine)');
  const body=document.body;
  const enabled=()=>body.classList.contains('ready')&&!body.classList.contains('is-intro')&&!body.classList.contains('visual-paused')&&!motion.matches&&!document.hidden;
  let timer=0,meteor=null,wasReady=false;
  const stopMeteor=()=>{clearTimeout(timer);timer=0;meteor?.remove();meteor=null;};
  function scheduleMeteor(){
    if(timer||!enabled())return;
    timer=setTimeout(()=>{
      timer=0;
      if(!enabled())return;
      if(!document.querySelector('dialog[open]')){
        meteor=document.createElement('i');meteor.className='dl-meteor';
        meteor.setAttribute('aria-hidden','true');
        meteor.style.setProperty('--dl-left',`${8+Math.random()*48}vw`);
        meteor.style.setProperty('--dl-top',`${10+Math.random()*18}vh`);
        body.append(meteor);
        const current=meteor;
        current.addEventListener('animationend',()=>{current.remove();if(meteor===current)meteor=null;},{once:true});
      }
      scheduleMeteor();
    },20000+Math.random()*15000);
  }
  document.querySelectorAll('.folder-control').forEach(button=>{
    const cover=button.querySelector('.folder-cover');if(!cover)return;
    const glare=document.createElement('span');glare.className='dl-folder-glare';
    glare.setAttribute('aria-hidden','true');cover.append(glare);
    let frame=0,point=null;
    const reset=()=>{cancelAnimationFrame(frame);frame=0;point=null;button.classList.remove('dl-hover');};
    button.addEventListener('pointermove',event=>{
      if(event.pointerType!=='mouse'||!mouse.matches||!enabled())return;
      point={x:event.clientX,y:event.clientY};
      if(frame)return;
      frame=requestAnimationFrame(()=>{
        frame=0;if(!point||!enabled())return;
        const rect=cover.getBoundingClientRect();
        const x=Math.max(0,Math.min(100,(point.x-rect.left)/Math.max(1,rect.width)*100));
        const y=Math.max(0,Math.min(100,(point.y-rect.top)/Math.max(1,rect.height)*100));
        glare.style.setProperty('--dl-x',`${x}%`);glare.style.setProperty('--dl-y',`${y}%`);
        button.classList.add('dl-hover');
      });
    },{passive:true});
    button.addEventListener('pointerleave',reset);
    button.addEventListener('pointercancel',reset);
    window.addEventListener('blur',reset);
    window.addEventListener('scroll',reset,{passive:true});
    motion.addEventListener('change',reset);mouse.addEventListener('change',reset);
  });
  function sync(){
    const ready=body.classList.contains('ready')&&!body.classList.contains('is-intro');
    if(!enabled()){
      stopMeteor();title?.classList.remove('dl-title-shine');
      document.querySelectorAll('.dl-hover').forEach(el=>el.classList.remove('dl-hover'));
    }else{
      if(ready&&!wasReady)title?.classList.add('dl-title-shine');
      scheduleMeteor();
    }
    wasReady=ready;
  }
  title?.addEventListener('animationend',event=>{if(event.animationName==='dl-title-shine')title.classList.remove('dl-title-shine');});
  new MutationObserver(sync).observe(body,{attributes:true,attributeFilter:['class']});
  document.addEventListener('visibilitychange',sync);motion.addEventListener('change',sync);
  sync();
})();
</script>

</body>
